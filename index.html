<style>
:root{--bg:#F1F3F0;--sf:#fff;--sf2:#E9EDE9;--ink:#182420;--soft:#5B6B62;--bd:#DCE3DC;--o:#1F7A5C;--os:#DCEFE6;--b:#2F6FD6;--r:#C22E1C;--sh:0 1px 2px rgba(24,36,32,.06),0 8px 24px -12px rgba(24,36,32,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;color:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{font-size:26px;font-weight:700;line-height:1.1}
.who small{display:block;font-size:12.5px;font-weight:500;color:var(--soft);margin-top:4px}
.ghost{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.h{font-size:13px;font-weight:700;color:var(--soft);margin:8px 2px 0;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:11px 15px;font-size:15px;font-weight:700;border-left:5px solid var(--o)}
.chip.mid{border-left-color:var(--b)}
.chip.on{background:var(--o);color:#fff;border-color:var(--o)}
.chip.mid.on{background:var(--b);border-color:var(--b)}
.names{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.name{border:1px solid var(--bd);background:var(--sf);border-radius:16px;padding:22px 10px;font-size:19px;font-weight:700;box-shadow:var(--sh)}
.today{width:100%;text-align:left;border:0;background:var(--o);color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)}
.today b{font-size:20px}.today span{font-size:13px;opacity:.9}
.today .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px 14px;box-shadow:var(--sh);font-size:15.5px;font-weight:700;line-height:1.3}
.tile small{display:block;font-size:12px;font-weight:500;color:var(--soft);margin-top:5px}
.tile.test{border-left:5px solid var(--r)}
.tile.off{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--soft)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
.box{width:30px;height:30px;border-radius:50%;border:2px dashed var(--bd);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--soft)}
.item.done .box{border:3px solid var(--o);background:var(--os);color:var(--o);font-size:16px}
.item.done .t{color:var(--soft);text-decoration:line-through}
.t{font-size:16px;font-weight:700;flex:1}
.t small{display:block;font-size:12px;font-weight:500;color:var(--soft);text-decoration:none;margin-top:3px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--sf2);color:var(--soft)}
.tag.auto{background:var(--os);color:var(--o)}
.empty{padding:22px 4px;color:var(--soft);font-size:14px}
.score{width:84px;border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:16px;font-weight:700;font-family:inherit;text-align:center}
.leave{border:0;background:var(--ink);color:#fff;border-radius:14px;padding:15px;font-size:15px;font-weight:700;width:100%}
.back{border:0;background:none;font-size:14px;font-weight:700;color:var(--soft);padding:4px 0;text-align:left}
.gc{background:var(--sf);border:1px solid var(--bd);border-top:4px solid var(--ac);border-radius:18px;padding:12px 12px 14px;box-shadow:var(--sh)}
.gh{font-size:13px;font-weight:700;color:var(--ac);margin:0 2px 10px;letter-spacing:.02em}
.gg{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px}
.t2{display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:8px 6px;border-radius:12px;background:var(--sf2);color:var(--ink);text-decoration:none;font-size:15px;font-weight:700;line-height:1.25}
.t2:active{background:var(--ac);color:#fff}
.t2.off{opacity:.45}
.ts{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--sf);border-radius:14px;padding:13px 14px;margin:0}
.ts .nm{font-weight:700;font-size:17px;flex:1}
.ts small{color:var(--soft);font-weight:500;margin-left:6px}
.ts.dn{background:var(--os);border-color:var(--o)}
.ts.dn .pl{background:var(--o);color:#fff}
.pl{font-size:13px;border-radius:999px;padding:3px 11px;background:#e8effb;color:#2b62c4;font-weight:700;white-space:nowrap}
.pl.z{background:transparent;border:1px solid var(--bd);color:var(--soft);font-weight:500}
.tlist{display:flex;flex-direction:column;gap:8px}
.hc{display:inline-block;font-size:12.5px;border:1px solid var(--bd);border-radius:999px;padding:3px 9px;margin:4px 4px 0 0;color:var(--soft)}
.dnav{display:flex;align-items:center;gap:8px}
.dnav .lb{flex:1;text-align:center;font-weight:700;font-size:15px}
.sum{font-size:13px;color:var(--soft);margin:2px 2px 0}
</style>
</head>

    {id:"s2",t:"V시그널",kind:"auto"},
    {id:"s3",t:"개별독해책",kind:"auto"},
    {id:"s4",t:"보카링크",kind:"score"},
    {id:"s5",t:"클카 독해 TEST",kind:"self"},
    {id:"s6",t:"비단챌 채점",kind:"auto"},
    {id:"sw",t:"SW 단어테스트",kind:"self"}
  ]
};
/* 모두 끝낸 학생에게만 보이는 칸. 내용은 선생님이 정함 */
var EXTRA = {t:"마지막 관문", items:[]};
var CARDS = [
  {id:"reg",label:"정규반",items:REGULAR},
  {id:"fri",label:"금요일",items:[]},
  {id:"nohw",label:"숙제 안 가져왔을 때",items:[]},
  {id:"mk",label:"보충 왔을 때",items:[
    {id:"m1",t:"교과서 필사노트",kind:"self",sub:"교과서 분석 내용 전부 쓰기"},
    {id:"m2",t:"기출문제 1세트",kind:"self",sub:"자기 학교 먼저 · 다음은 전국"}
  ]}
];
function itemsFor(cls,card){
  if(card==="reg") return CLASS_ITEMS[cls]||REGULAR;
  var c=CARDS.filter(function(x){return x.id===card})[0];return c?c.items:[];
}
var IDLE_MIN = 40;
var SRV = "https://script.google.com/macros/s/AKfycbyGjwU2UXP8hoRLn0VThkus7bj_ZnGc12ByvFXuFDVtPSz-GmyumnDd2CkLSBWJw81I/exec";
var T = /[?&]t=1/.test(location.search);
function iso(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function post(b){return fetch(SRV,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw 0})}
function qget(){var a=[];try{a=JSON.parse(ls("bd-q")||"[]")}catch(e){}return a}
function qkey(b){return b.date+"|"+b.name+"|"+b.card}
function qadd(b){var a=qget().filter(function(x){return qkey(x)!==qkey(b)});a.push(b);ls("bd-q",JSON.stringify(a.slice(-60)))}
function qdrop(b){ls("bd-q",JSON.stringify(qget().filter(function(x){return qkey(x)!==qkey(b)})))}
function flush(){var a=qget();if(!a.length)return;ls("bd-q","[]");a.forEach(function(b){post(b).catch(function(){qadd(b)})})}
function sync(n,c,card,m){var b={a:"put",date:iso(),cls:c,name:n,card:card,chk:m};qdrop(b);post(b).then(flush).catch(function(){qadd(b)})}
function pull(n,c){
  fetch(SRV+"?a=get&date="+iso()+"&name="+encodeURIComponent(n)).then(function(r){return r.json()}).then(function(j){
    if(!j||!j.ok)return;var ch=false;
    for(var card in j.chk){var loc=chk(n,card),srv=j.chk[card],mg={},k;for(k in loc)mg[k]=loc[k];for(k in srv){if(srv[k]&&!mg[k]){mg[k]=srv[k];ch=true}}ls(key(n,card),JSON.stringify(mg))}
    if(ch&&ls("bd-name")===n)render();
  }).catch(function(){});
}
/* ---------- 선생님 화면 (?t=1) ---------- */
var TS = {cls:null, date:null, rows:null, open:null, hist:{}, err:""};
function tpw(){return ls("bt-pw")||""}
function dstep(s,n){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dlabel(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return (d.getMonth()+1)+"/"+d.getDate()+"("+"일월화수목금토"[d.getDay()]+")"}
function tcard(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay()===5?"fri":"reg"}
function tload(){
  if(!TS.date)TS.date=iso();if(!TS.cls)TS.cls=Object.keys(ROSTER)[0];
  if(!tpw()){TS.rows=null;render();return}
  fetch(SRV+"?a=day&date="+TS.date+"&pw="+encodeURIComponent(tpw())).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){if(j.err==="pw"){ls("bt-pw",null);TS.err="비밀번호가 맞지 않음"}render();return}
    TS.err="";TS.rows={};j.rows.forEach(function(x){TS.rows[x.name]=x});render();
  }).catch(function(){TS.err="불러오지 못함";render()});
}
function thist(name){
  fetch(SRV+"?a=hist&name="+encodeURIComponent(name)+"&pw="+encodeURIComponent(tpw())).then(function(r){return r.json()}).then(function(j){if(j.ok){TS.hist[name]=j.rows;render()}}).catch(function(){});
}
function trow(cls,name,card){
  var items=itemsFor(cls,card),row=TS.rows&&TS.rows[name],ck=(row&&row.chk&&row.chk[card])||{};
  var n=items.filter(function(i){return ck[i.id]}).length;
  return {name:name,items:items,ck:ck,n:n,t:items.length,seen:!!row};
}
function isdone(r){return r.t>0&&r.n>=r.t}
function renderT(){
  var app=document.getElementById("app"),h="";
  document.title="보드 교사용";if(!TS.date)TS.date=iso();if(!TS.cls)TS.cls=Object.keys(ROSTER)[0];
  if(!tpw()){
    h+='<div class="top"><div class="who">보드 기록<small>선생님용</small></div></div>';
    h+='<div class="card"><input class="score" id="tpw" type="password" inputmode="numeric" placeholder="비밀번호" style="width:100%;text-align:left"><button class="leave" data-tl="1" style="margin-top:10px">열기</button>'+(TS.err?'<div class="empty">'+esc(TS.err)+'</div>':'')+'</div>';
    app.innerHTML=h;return;
  }
  var card=tcard(TS.date),list=ROSTER[TS.cls].map(function(nm){return trow(TS.cls,nm,card)});
  var dn=list.filter(isdone).length,no=list.filter(function(r){return !r.seen}).length,go=list.length-dn-no;
  list.sort(function(a,b){var fa=isdone(a)?1:0,fb=isdone(b)?1:0;if(fa!==fb)return fa-fb;var ra=a.t?a.n/a.t:0,rb=b.t?b.n/b.t:0;if(ra!==rb)return ra-rb;return a.name.localeCompare(b.name,"ko")});
  h+='<div class="top"><div class="who">보드 기록<small>'+dlabel(TS.date)+'</small></div><button class="ghost" data-tout="1">잠금</button></div>';
  h+='<div class="dnav"><button class="ghost" data-td="-1">‹</button><div class="lb">'+dlabel(TS.date)+'</div><button class="ghost" data-td="1">›</button><button class="ghost" data-td="0">오늘</button></div>';
  h+='<div class="tabs">'+Object.keys(ROSTER).map(function(c){return '<button class="tab'+(c===TS.cls?' on':'')+'" data-tt="'+c+'">'+c+'</button>'}).join("")+'</div>';
  h+='<div class="sum">완료 '+dn+' · 진행 '+go+' · 미접속 '+no+'</div>';
  if(TS.err)h+='<div class="empty">'+esc(TS.err)+'</div>';
  if(card==="fri"&&!list[0].t)h+='<div class="empty">금요일 항목 준비 중</div>';
  h+='<div class="tlist">';
  list.forEach(function(r){
    var open=TS.open===r.name;
    h+='<button class="ts'+(isdone(r)?' dn':'')+'" data-st="'+esc(r.name)+'"><span class="nm">'+esc(r.name)+'</span><span class="pl'+(r.seen?'':' z')+'">'+(r.seen?r.n+' / '+r.t:'미접속')+'</span></button>';
    if(open){
      h+='<div class="card">';
      r.items.forEach(function(it,ix){var d=!!r.ck[it.id];h+='<div class="item'+(d?' done':'')+'"><span class="box">'+(d?'✓':(ix+1))+'</span><span class="t">'+esc(it.t)+(it.kind==="score"&&d&&r.ck[it.id]!==1?' <small>'+esc(r.ck[it.id])+'점</small>':'')+'</span></div>'});
      var hs=TS.hist[r.name];
      if(hs){h+='<div style="margin-top:10px">'+hs.slice(0,10).map(function(x){var cd=tcard(x.date),it=itemsFor(TS.cls,cd),ck=(x.chk&&x.chk[cd])||{},n=it.filter(function(i){return ck[i.id]}).length;return '<span class="hc">'+dlabel(x.date)+' '+n+'/'+it.length+'</span>'}).join("")+'</div>'}
      h+='</div>';
    }
  });
  h+='</div>';
  app.innerHTML=h;
}
document.addEventListener("click",function(e){
  if(!T)return;var b=e.target.closest("button");if(!b)return;var D=b.dataset;
  if(D.tl){var v=document.getElementById("tpw").value.trim();if(v){ls("bt-pw",v);TS.err="";tload()}}
  else if(D.tout){ls("bt-pw",null);TS.rows=null;render()}
  else if(D.tt){TS.cls=D.tt;TS.open=null;render()}
  else if(D.td!==undefined){TS.date=D.td==="0"?iso():dstep(TS.date,+D.td);TS.open=null;TS.rows=null;tload()}
  else if(D.st){TS.open=TS.open===D.st?null:D.st;if(TS.open&&!TS.hist[TS.open])thist(TS.open);render()}
});
/* ---------- 상태 ---------- */
var S = {view:"names", cls:null, card:null};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function who(){var n=ls("bd-name"),t=+ls("bd-t")||0;if(n&&Date.now()-t>IDLE_MIN*60000){leave();return null}return n}
function touch(){ls("bd-t",String(Date.now()))}
function leave(){ls("bd-name",null);ls("bd-cls",null);ls("bd-t",null);S.view="names"}
function clsOf(n){var s=ls("bd-cls");if(s&&ROSTER[s]&&ROSTER[s].indexOf(n)>-1)return s;for(var c in ROSTER)if(ROSTER[c].indexOf(n)>-1)return c;return ""}
function dstr(){var d=new Date(),w="일월화수목금토"[d.getDay()];return (d.getMonth()+1)+"/"+d.getDate()+"("+w+")"}
function key(n,c){var d=new Date();return "bd-chk|"+n+"|"+c+"|"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function chk(n,c){try{return JSON.parse(ls(key(n,c))||"{}")}catch(e){return {}}}
function defCard(cls){var w=new Date().getDay();return w===5?"fri":"reg"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hubHtml(c1){
  var o="";
  HUB.forEach(function(g){
    var its=g.items.filter(function(a){return !(a.not&&a.not.indexOf(c1)>-1)});
    if(!its.length)return;
    o+='<div class="gc" style="--ac:'+g.ac+'"><div class="gh">'+esc(g.h)+'</div><div class="gg" style="--c:'+Math.min(g.cols,its.length)+'">'+its.map(function(a){return a.u?'<a class="t2" href="'+a.u+'">'+esc(a.n)+'</a>':'<span class="t2 off">'+esc(a.n)+'</span>'}).join("")+'</div></div>';
  });
  return o;
}
/* ---------- 화면 ---------- */
function render(){
  if(T){renderT();return}
  var app=document.getElementById("app"),h="",name=who();
  if(!name){
    var grp=S.cls||Object.keys(GROUPS)[0],list=[];
    GROUPS[grp].forEach(function(c){ROSTER[c].forEach(function(n){list.push({n:n,c:c})})});
    list.sort(function(a,b){return a.n.localeCompare(b.n,"ko")});
    h+='<div class="top"><div class="who">이름을 눌러 주세요<small>'+dstr()+'</small></div></div>';
    h+='<div class="chips">'+Object.keys(GROUPS).map(function(g){return '<button class="chip'+(g===grp?' on':'')+'" data-cls="'+g+'">'+g+'</button>'}).join("")+'</div>';
    h+='<div class="names">'+list.map(function(x){return '<button class="name" data-name="'+esc(x.n)+'" data-c="'+x.c+'">'+esc(x.n)+'</button>'}).join("")+'</div>';
  } else if(S.view==="today"){
    var c0=clsOf(name),card=S.card||defCard(c0),cdItems=itemsFor(c0,card),done=chk(name,card),cd={items:cdItems};
    h+='<button class="back" data-go="hub">‹ 돌아가기</button>';
    h+='<div class="top"><div class="who">오늘 할 일<small>'+esc(name)+' · '+dstr()+'</small></div></div>';
    h+='<div class="tabs">'+CARDS.map(function(x){return '<button class="tab'+(x.id===card?' on':'')+'" data-card="'+x.id+'">'+x.label+'</button>'}).join("")+'</div>';
    h+='<div class="card">';
    if(!cd.items.length) h+='<div class="empty">항목 준비 중</div>';
    cd.items.forEach(function(it,ix){
      var d=!!done[it.id];
      if(it.kind==="score"){
        h+='<div class="item'+(d?' done':'')+'"><span class="box">'+(d?'✓':(ix+1))+'</span><span class="t">'+esc(it.t)+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+'</span><input class="score" type="number" inputmode="numeric" min="0" max="100" data-score="'+it.id+'" data-card="'+card+'" value="'+(done[it.id]&&done[it.id]!==1?esc(done[it.id]):'')+'" placeholder="점수"></div>';
        return;
      }
          h+='<button class="item'+(d?' done':'')+'" data-it="'+it.id+'" data-card="'+card+'"><span class="box">'+(d?'✓':(ix+1))+'</span><span class="t">'+esc(it.t)+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+'</span></button>';
    });
    h+='</div>';
    if(card==="reg" && EXTRA.items.length && cd.items.length && cd.items.every(function(i){return done[i.id]})){
      var ex=chk(name,"extra");
      h+='<div class="h">'+EXTRA.t+'</div><div class="card">';
      EXTRA.items.forEach(function(it,ix){
        var d=!!ex[it.id];
        h+='<button class="item'+(d?' done':'')+'" data-it="'+it.id+'" data-card="extra"><span class="box">'+(d?'✓':(ix+1))+'</span><span class="t">'+esc(it.t)+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+'</span></button>';
      });
      h+='</div>';
    }
  } else {
    var c1=clsOf(name),dcard=defCard(c1),cdn=chk(name,dcard),reg=itemsFor(c1,dcard),dn=reg.filter(function(i){return cdn[i.id]}).length;
    h+='<div class="top"><div class="who">'+esc(name)+'<small>'+dstr()+'</small></div><button class="ghost" data-go="switch">다른 학생</button></div>';
    h+='<button class="today" data-go="today"><div><b>오늘 할 일</b></div><div class="n">'+dn+' / '+reg.length+'</div></button>';
    h+=hubHtml(c1);
    h+='<button class="leave" data-go="leave">저장하고 나가기</button>';
  }
  app.innerHTML=h;
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.cls){S.cls=b.dataset.cls;render()}
  else if(b.dataset.name){ls("bd-name",b.dataset.name);ls("bd-cls",b.dataset.c);touch();S.view="hub";render();pull(b.dataset.name,b.dataset.c)}
  else if(b.dataset.it){var n=ls("bd-name"),c=b.dataset.card,m=chk(n,c);m[b.dataset.it]=m[b.dataset.it]?0:1;ls(key(n,c),JSON.stringify(m));touch();render();sync(n,clsOf(n),c,m)}
  else if(b.dataset.card){S.card=b.dataset.card;render()}
  else if(b.dataset.go==="today"){S.view="today";S.card=null;touch();render()}
  else if(b.dataset.go==="hub"){S.view="hub";render()}
  else if(b.dataset.go==="switch"||b.dataset.go==="leave"){leave();render()}
});
if(who())S.view="hub";
render();
if(T){tload();setInterval(tload,30000)}else{if(who())pull(ls("bd-name"),ls("bd-cls"));flush();setInterval(flush,60000)}
document.addEventListener("change",function(e){
  var i=e.target;if(!i.dataset||!i.dataset.score)return;
  var n=ls("bd-name"),c=i.dataset.card,m=chk(n,c);
  if(i.value==="")delete m[i.dataset.score];else m[i.dataset.score]=i.value;
  ls(key(n,c),JSON.stringify(m));touch();render();sync(n,clsOf(n),c,m);
});
setInterval(function(){if(ls("bd-name")&&!who())render()},60000);
</script>
