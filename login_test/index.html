<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>로그인 시험</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;background:#f1f5f9;color:#0f172a}
#who{position:fixed;top:8px;right:12px;font-size:12px;color:#94a3b8;z-index:5}
#top{position:fixed;top:6px;left:10px;z-index:5}
#top button{font-size:12px;color:#64748b;background:none;border:1px solid #cbd5e1;border-radius:8px;padding:4px 10px}
.wrap{max-width:460px;margin:0 auto;padding:56px 18px 40px}
h1{font-size:20px;margin:0 0 18px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:#475569;margin:10px 0 4px}
input{width:100%;font-size:18px;padding:12px;border:1px solid #cbd5e1;border-radius:10px}
.btn{width:100%;margin-top:16px;padding:14px;font-size:17px;border:0;border-radius:10px;background:#0e7490;color:#fff}
.btn.sub{background:#e2e8f0;color:#334155}
.err{color:#b91c1c;font-size:14px;margin-top:10px;min-height:18px}
.item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #e2e8f0;font-size:17px}
.item:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:7px;border:2px solid #94a3b8;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.item.on .box{background:#0e7490;border-color:#0e7490}
.item.on span.t{color:#94a3b8;text-decoration:line-through}
.exit{background:#f8fafc;border-radius:10px;margin-top:8px}
.big{position:fixed;inset:0;background:#0e7490;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:20;text-align:center;padding:20px}
.big button{font-size:26px;padding:22px 44px;border:0;border-radius:16px;background:#fff;color:#0e7490;font-weight:700}
.big small{opacity:.85;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal .box2{background:#fff;border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center}
.modal .box2 p{font-size:20px;margin:0 0 18px}
.modal .row{display:flex;gap:10px}
.modal .row button{flex:1;padding:14px;font-size:17px;border:0;border-radius:10px}
.modal .yes{background:#0e7490;color:#fff}
.modal .no{background:#e2e8f0;color:#334155}
.hide{display:none!important}
.dev{font-size:12px;color:#64748b;line-height:1.7}
</style>
</head>
<body>
<div id="who"></div>
<div id="top" class="hide"><button id="btnExitSmall">나가기</button></div>
<div class="wrap">
  <div id="vLogin" class="hide">
    <h1>이름과 비번을 넣어요</h1>
    <div class="card">
      <label>이름</label><input id="iName" autocomplete="off" autocapitalize="off">
      <label>비번</label><input id="iPw" type="password" autocomplete="off">
      <div class="err" id="eLogin"></div>
      <button class="btn" id="bLogin">들어가기</button>
    </div>
  </div>
  <div id="vChange" class="hide">
    <h1>나만의 비번으로 바꿔요</h1>
    <div class="card">
      <label>새 비번 (4자 이상)</label><input id="iNew" type="password" autocomplete="off">
      <label>한 번 더</label><input id="iNew2" type="password" autocomplete="off">
      <div class="err" id="eChange"></div>
      <button class="btn" id="bChange">바꾸기</button>
    </div>
  </div>
  <div id="vTodo" class="hide">
    <h1>오늘 할 일</h1>
    <div class="card" id="list"></div>
  </div>
  <div id="vSetup" class="card hide">
    <div class="dev"><b>시험용 준비 (샘플 이름만)</b><br>
    <button class="btn sub" id="bMk">샘플1·샘플2·샘플3 계정 만들기 (처음 비번 1234)</button>
    <div id="mkOut" class="dev"></div></div>
  </div>
</div>
<div id="vDone" class="big hide"><div style="font-size:26px;font-weight:700">기록이 저장되었습니다</div><small>다음 친구가 이름을 고르면 돼요</small></div>
<div id="vFinish" class="big hide"><div style="font-size:26px;font-weight:700">오늘 할 일을 모두 마쳤어요</div><button id="bFinish">저장하고 나가기</button></div>
<div id="vAway" class="modal hide"><div class="box2"><p id="awayMsg"></p><div class="row"><button class="no" id="bOther">다른 이름</button><button class="yes" id="bSame">맞아요</button></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,updatePassword,signOut,createUserWithEmailAndPassword,setPersistence,browserLocalPersistence,GoogleAuthProvider,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

var Q=new URLSearchParams(location.search);
var AWAY_MIN=Q.get("away")?parseFloat(Q.get("away")):15;      // 시험용: ?away=0.2 (분)
var APP=initializeApp({apiKey:"AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA",authDomain:"nolbada.github.io",projectId:"h-roadmap",appId:"1:575520405083:web:b9f40b64cb0ae3d1a9317e"});
var AU=getAuth(APP), DB=getFirestore(APP);
var $=function(i){return document.getElementById(i)};
var BAD=["1234","0000","1111","2222","3333","4444","5555","6666","7777","8888","9999","12345","123456","1q2w3e4r"];
var ITEMS=["비단챌","V시그널","독해 33","문법","단어"];   // 시험용 샘플 목록
var NAME="", CHK={}, SEQ=0;

function hex(s){var b=new TextEncoder().encode(s),o="";for(var i=0;i<b.length;i++)o+=("0"+b[i].toString(16)).slice(-2);return o}
// Firebase 비밀번호는 최소 6자라서, 학생이 넣는 4자 이상 비번 앞뒤에 고정 글자를 붙여 보낸다(학생은 모름)
function ap(p){return p+"#vt"}
function mail(n){return "n"+hex(n.trim())+"@vita.local"}
function nameOf(u){return localStorage.getItem("lt_name_"+u.uid)||""}
// 하루 기준: 새벽 4시에 바뀜
function dayKey(d){d=d||new Date();var x=new Date(d.getTime()-4*3600*1000);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()}
function show(id){["vLogin","vChange","vTodo"].forEach(function(k){$(k).classList.toggle("hide",k!==id)});$("top").classList.toggle("hide",id!=="vTodo")}

await setPersistence(AU,browserLocalPersistence);

onAuthStateChanged(AU,async function(u){
  if(u&&u.email&&u.email.indexOf("@vita.local")<0){NAME="";show("");return}
  if(!u){NAME="";$("who").textContent="";show("vLogin");return}
  // 하루가 바뀌었으면(새벽 4시 기준) 로그인 정리
  var ld=localStorage.getItem("lt_day_"+u.uid);
  if(ld&&ld!==dayKey()){await signOut(AU);return}
  if(!ld)localStorage.setItem("lt_day_"+u.uid,dayKey());
  NAME=nameOf(u);$("who").textContent=NAME;
  if(localStorage.getItem("lt_force_"+u.uid)==="1"){show("vChange");return}
  await loadTodo();
});

$("bLogin").onclick=async function(){
  var n=$("iName").value.trim(),p=$("iPw").value;$("eLogin").textContent="";
  if(!n||!p){$("eLogin").textContent="이름과 비번을 넣어 주세요";return}
  try{
    var c=await signInWithEmailAndPassword(AU,mail(n),ap(p));
    localStorage.setItem("lt_name_"+c.user.uid,n);
    localStorage.setItem("lt_day_"+c.user.uid,dayKey());
    if(BAD.indexOf(p)>=0)localStorage.setItem("lt_force_"+c.user.uid,"1");
    $("iPw").value="";
    location.reload();
  }catch(e){$("eLogin").textContent="이름이나 비번이 맞지 않아요"}
};
$("bChange").onclick=async function(){
  var a=$("iNew").value,b=$("iNew2").value;$("eChange").textContent="";
  if(a.length<4){$("eChange").textContent="4자 이상으로 해 주세요";return}
  if(BAD.indexOf(a)>=0||/^(.)\1+$/.test(a)){$("eChange").textContent="너무 쉬운 비번이에요";return}
  if(a===NAME){$("eChange").textContent="이름과 다르게 해 주세요";return}
  if(a!==b){$("eChange").textContent="두 번이 서로 달라요";return}
  try{await updatePassword(AU.currentUser,ap(a));localStorage.removeItem("lt_force_"+AU.currentUser.uid);location.reload()}
  catch(e){$("eChange").textContent=(e.code==="auth/requires-recent-login")?"다시 로그인해 주세요":"바꾸지 못했어요"}
};

// 할 일: board_s(샘플 전용 컬렉션) 안의 샘플 이름 문서에만 쓴다
function docId(){return dayKey()+"|"+NAME}
async function loadTodo(){
  CHK={};SEQ=0;
  try{var s=await getDoc(doc(DB,"board_s",docId()));if(s.exists()){CHK=JSON.parse(s.data().chk||"{}");SEQ=s.data().seq||0}}catch(e){}
  show("vTodo");draw();
}
function draw(){
  var h="",all=true;
  ITEMS.forEach(function(t,i){var on=!!CHK["i"+i];if(!on)all=false;h+='<div class="item'+(on?' on':'')+'" data-i="'+i+'"><div class="box">'+(on?'&#10003;':'')+'</div><span class="t">'+t+'</span></div>'});
  h+='<div class="item exit" id="exitRow"><div class="box"></div><span class="t">저장하고 나가기</span></div>';
  $("list").innerHTML=h;
  $("vFinish").classList.toggle("hide",!all);
}
$("list").onclick=async function(e){
  var r=e.target.closest(".item");if(!r)return;
  if(r.id==="exitRow"){await doExit();return}
  var i=r.getAttribute("data-i");CHK["i"+i]=!CHK["i"+i];draw();
  SEQ++;
  try{await setDoc(doc(DB,"board_s",docId()),{date:dayKey(),cls:"시험",name:NAME,chk:JSON.stringify(CHK),t:new Date().toISOString().slice(0,19),seq:SEQ})}catch(e){}
};
async function doExit(){
  $("vFinish").classList.add("hide");
  var uid=AU.currentUser&&AU.currentUser.uid;
  await signOut(AU);
  if(uid){localStorage.removeItem("lt_away_"+uid)}
  $("vDone").classList.remove("hide");
  setTimeout(function(){$("vDone").classList.add("hide");location.reload()},2200);
}
$("bFinish").onclick=doExit;$("btnExitSmall").onclick=doExit;

// 앱을 떠났다가 오래 지나 돌아오면 이름 확인 한 번(비번 재입력 없음)
var AWAYKEY="lt_away";
document.addEventListener("visibilitychange",function(){
  if(!AU.currentUser)return;
  if(document.visibilityState==="hidden"){localStorage.setItem(AWAYKEY,String(Date.now()))}
  else{
    var t=parseInt(localStorage.getItem(AWAYKEY)||"0",10);
    if(t&&(Date.now()-t)>AWAY_MIN*60000&&NAME){
      $("awayMsg").textContent=NAME+" 맞나요?";$("vAway").classList.remove("hide");
    }
    localStorage.removeItem(AWAYKEY);
  }
});
$("bSame").onclick=function(){$("vAway").classList.add("hide")};
$("bOther").onclick=async function(){$("vAway").classList.add("hide");await signOut(AU);location.reload()};

// 선생님 시험 패널(?setup=1): 선생님 구글 계정으로 로그인한 뒤, 이미 배포된 서버 함수(vita-auth-admin)로 샘플 계정을 만들고 초기화하고 지운다.
var FN="https://vita-auth-admin-575520405083.asia-northeast3.run.app";
if(Q.get("setup")==="1"){
  var P=$("vSetup");P.classList.remove("hide");
  P.innerHTML='<div class="dev"><b>선생님 시험 패널</b><br><button class="btn sub" id="tIn">선생님 구글 로그인</button><button class="btn sub" id="tPing">연결 확인</button><button class="btn sub" id="tMk">샘플 3개 만들기 (처음 비번 1234)</button><button class="btn sub" id="tRs">샘플1 비번을 0000으로 초기화</button><button class="btn sub" id="tDl">샘플 3개 지우기</button><button class="btn sub" id="tCmp">명부와 계정 대조 (읽기만)</button><button class="btn sub" id="tAll">계정 없는 재원생 계정 만들기 (처음 비번 1234)</button><div id="mkOut" class="dev"></div></div>';
  var say=function(t){$("mkOut").style.cssText="font-size:15px;color:#0f172a;margin-top:12px;word-break:break-all";$("mkOut").textContent=t};
  var call=async function(o){var t=await AU.currentUser.getIdToken();var r=await fetch(FN,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+t},body:JSON.stringify(o)});return r.status+" "+(await r.text())};
  $("tCmp").onclick=async function(){say("대조 중...");
    try{
      var r1=JSON.parse((await call({op:"list"})).replace(/^\d+ /,""));
      var AC=(r1.users||[]).filter(function(u){return /@vita\.local$/.test(u.email)&&/^[a-z0-9]{8}$/.test(u.uid)});
      var sn=await getDoc(doc(DB,"hw_c","master"));var d=JSON.parse(sn.data().j);var RS=d.s||[];
      var st={};RS.forEach(function(x){var k=x.status||"(없음)";st[k]=(st[k]||0)+1});
      var act=RS.filter(function(x){return x.status!=="off"});
      var byId={},byName={};AC.forEach(function(a){byId[a.uid]=a.name;byName[a.name]=a.uid});
      var L=["명부 전체 "+RS.length+"명, 상태별 "+JSON.stringify(st),"학생 계정 "+AC.length+"개 (전체 계정 "+(r1.users||[]).length+"개)"];
      var noAcc=[],diff=[];
      act.forEach(function(x){var nm=String(x.name||"").replace(/\s+/g,"");
        if(!byId[x.id]){noAcc.push(nm+"("+x.id+")"+(byName[nm]?" 이름 같은 계정은 있으나 번호 다름: "+byName[nm]:""))}
        else if(byId[x.id]!==nm){diff.push("번호 "+x.id+" 명부 "+nm+" / 계정 "+byId[x.id])}});
      var ids={};RS.forEach(function(x){ids[x.id]=x});
      var extra=AC.filter(function(a){return !ids[a.uid]||ids[a.uid].status==="off"}).map(function(a){return a.name+"("+a.uid+")"+(ids[a.uid]?" 명부에서 퇴원":" 명부에 없음")});
      L.push("계정 없는 재원 명부 "+noAcc.length+"명: "+(noAcc.join(", ")||"없음"));
      L.push("번호는 같고 이름이 다른 것 "+diff.length+"건: "+(diff.join(" | ")||"없음"));
      L.push("명부에 없거나 퇴원인데 계정이 있는 것 "+extra.length+"건: "+(extra.join(", ")||"없음"));
      $("mkOut").style.whiteSpace="pre-wrap";say(L.join("\n"));
    }catch(e){say("대조 실패 "+(e.code||e.message))}
  };
  $("tAll").onclick=async function(){say("준비 중...");
    try{
      var r1=JSON.parse((await call({op:"list"})).replace(/^\d+ /,""));
      var have={};(r1.users||[]).forEach(function(u){have[u.uid]=1});
      var sn=await getDoc(doc(DB,"hw_c","master"));var RS=JSON.parse(sn.data().j).s||[];
      var todo=RS.filter(function(x){return x.status!=="off"&&!have[x.id]&&/^[a-z0-9]{8}$/.test(x.id)});
      var nmC={};RS.forEach(function(x){var n=String(x.name||"").replace(/\s+/g,"");nmC[n]=(nmC[n]||0)+1});
      var dup=todo.filter(function(x){return nmC[String(x.name||"").replace(/\s+/g,"")]>1});
      if(dup.length){say("같은 이름이 있어 중단: "+dup.map(function(x){return x.name}).join(", "));return}
      var ok=0,bad=[];
      for(var i=0;i<todo.length;i+=5){
        await Promise.all(todo.slice(i,i+5).map(async function(x){var nm=String(x.name||"").replace(/\s+/g,"");
          try{var s=await call({op:"create",id:x.id,name:nm});if(/^200 /.test(s))ok++;else bad.push(nm+" "+s)}catch(e){bad.push(nm+" 실패")}}));
        say("만드는 중 "+Math.min(i+5,todo.length)+"/"+todo.length);
      }
      $("mkOut").style.whiteSpace="pre-wrap";
      say("만들 대상 "+todo.length+"명 / 성공 "+ok+"명 / 실패 "+bad.length+"건"+(bad.length?"\n"+bad.join("\n"):""));
    }catch(e){say("실패 "+(e.code||e.message))}
  };
  $("tIn").onclick=async function(){try{var c=await signInWithPopup(AU,new GoogleAuthProvider());say("로그인 "+c.user.email)}catch(e){say("로그인 실패 "+(e.code||e.message))}};
  $("tPing").onclick=async function(){say("처리 중... 잠시만요");try{say(await call({op:"ping"}))}catch(e){say("실패 "+(e.code||e.message))}};
  $("tMk").onclick=async function(){say("만드는 중... 최대 20초");var o=[];for(var i=1;i<=3;i++){try{o.push(await call({op:"create",id:"tst"+i,name:"샘플"+i}))}catch(e){o.push("실패")}}say(o.join(" | "))};
  $("tRs").onclick=async function(){say("초기화 중...");try{say(await call({op:"reset",id:"tst1"}))}catch(e){say("실패")}};
  $("tDl").onclick=async function(){say("지우는 중...");var o=[];for(var i=1;i<=3;i++){try{o.push(await call({op:"delete",id:"tst"+i}))}catch(e){o.push("실패")}}say(o.join(" | "))};
}
</script>
</body>
</html>
