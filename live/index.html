<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<title>실시간 현황</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0D1E30;color:#eaf1f6;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:10px 14px 12px}
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 10px}
.top h1{font-size:22px;margin:0;font-weight:800}
.cnt{display:flex;gap:18px;font-size:17px;font-weight:700;align-items:baseline}
.cnt b{font-size:28px;margin-right:4px}
.cnt .g b{color:#43d19a}.cnt .y b{color:#f0b64a}.cnt .r b{color:#ff6b61}.cnt .d b{color:#9fb6c6}
.grid{flex:1 1 auto;display:grid;gap:10px;min-height:0}
.t{position:relative;border-radius:14px;background:#16324a;border:2px solid #23496a;padding:calc(var(--u)*.7) calc(var(--u)*.9);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0;min-height:0}
.t .nm{font-size:calc(var(--u)*2.1);font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .tm{font-size:calc(var(--u)*.95);color:#a9c0d0;font-weight:700;margin-top:calc(var(--u)*.2)}
.seg{display:flex;gap:calc(var(--u)*.22);margin:calc(var(--u)*.5) 0}
.seg i{flex:1;height:calc(var(--u)*.7);border-radius:99px;background:#2a4a66}
.seg i.on{background:#43d19a}
.t .nx{font-size:calc(var(--u)*1);font-weight:700;color:#d6e4ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .nx small{color:#8fa9bb;font-weight:600;margin-right:calc(var(--u)*.3)}
.t.y{border-color:#f0b64a;background:#2d2a1c}
.t.y .tm{color:#f0b64a}
.t.y .seg i.on{background:#f0b64a}
.t.r{border-color:#ff6b61;background:#3a1f22;animation:pz 1.6s ease-in-out infinite}
.t.r .tm{color:#ff8a82}
.t.r .seg i.on{background:#ff6b61}
.t.d{background:#1b6b50;border-color:#43d19a}
.t.d .tm,.t.d .nx{color:#d8fbe9}
.t.d .seg i{background:#2f8f6f}.t.d .seg i.on{background:#d8fbe9}
@keyframes pz{0%,100%{box-shadow:0 0 0 0 rgba(255,107,97,0)}50%{box-shadow:0 0 0 6px rgba(255,107,97,.35)}}
.ov{position:fixed;inset:0;background:rgba(5,12,20,.82);display:flex;align-items:center;justify-content:center;z-index:20}
.pn{width:min(600px,92vw);max-height:88vh;overflow:auto;background:#16324a;border:2px solid #2f6a96;border-radius:16px;padding:18px 20px}
.pn h2{margin:0 0 4px;font-size:26px}
.pn .sub{font-size:14px;color:#9fb6c6;margin-bottom:12px}
.dr{font-size:18px;padding:8px 0;border-bottom:1px solid #23496a;color:#a9c0d0}
.dr.ok{color:#43d19a;font-weight:700}
.dr small{color:#8fa9bb;font-weight:600;margin-left:8px;font-size:13px}
.dr em{font-style:normal;font-size:12px;border:1px solid #35566f;border-radius:99px;padding:1px 8px;margin-right:8px;color:#8fa9bb}
.dr.ok em{border-color:#43d19a;color:#43d19a}
.ph{font-size:13px;color:#8fa9bb;margin:16px 0 4px;font-weight:700}
.rm{display:flex;gap:8px}
.rm button{border:1px solid #35566f;background:#16324a;color:#cfe0ec;border-radius:99px;padding:7px 16px;font-size:16px;font-weight:700}
.rm button.on{background:#2f6a96;color:#fff;border-color:#5aa0d0}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:#7f98aa;font-size:22px}
.st{position:fixed;right:10px;bottom:6px;font-size:11px;color:#6f8799}
.st button{border:1px solid #35566f;background:#16324a;color:#cfe0ec;border-radius:99px;padding:4px 10px;font-size:11px;margin-left:6px}
iframe{position:absolute;left:-9999px;top:0;width:10px;height:10px;border:0}
.t .tm{font-size:calc(var(--u)*1.5);margin-top:calc(var(--u)*.3);color:#dbe9f2}
.t .seg i{height:calc(var(--u)*1.3)}
.t .seg{margin:calc(var(--u)*.6) 0 0}
.t.d .tm{color:#43d19a}
.t .tt{font-size:calc(var(--u)*1.3);color:#8fa9bb;font-weight:700;margin-top:calc(var(--u)*.2)}
.t .tt.ov{color:#ff4d4d}
</style>
</head>
<body>
<div id="app"></div>
<div class="st" id="st"></div>
<iframe id="df" src="../index.html" tabindex="-1" aria-hidden="true"></iframe>
<script type="module">
var F=null,DB=null,DOCS={},SUBS={},STATE="준비 중",TMR=0,STOP=0,MAXH=4,NAMES={},AMOD=null,APP=null,AU=null,AUNS=null,ATT=null,ROOM="";try{ROOM=localStorage.getItem("live-room")||""}catch(e){}
var TD="";
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nowM(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function hm(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function tmin(s){var p=String(s||"").split(":");if(p.length<2)return -1;return (+p[0]||0)*60+(+p[1]||0)}
function ready(){try{return F&&typeof F.itemsFor==="function"&&typeof F.slotOf==="function"&&F.ROSTER&&F.iso}catch(e){return false}}

function names(){
  var out=[],seen={},c;
  for(c in F.ROSTER){
    if(/고등|관리형/.test(c))continue;
    (F.ROSTER[c]||[]).forEach(function(n){if(n&&!/^(시험|샘플|열람)/.test(n)&&!seen[n]){seen[n]=1;NAMES[n]=1;out.push(n)}});
  }
  return out;
}

function build(){
  var slot=F.slotOf(TD),out=[],now=nowM(),nm;
  var all={},k0,g0=slot==="fri"?"금":(slot==="sat"?"토":"");
  for(k0 in DOCS)all[k0]=1;
  if(ATT&&g0)for(k0 in ATT){if(k0.indexOf(g0+"|")===0&&ATT[k0]&&ATT[k0].status==="in"){var an=k0.slice(2);if(an&&!/^(시험|샘플|열람)/.test(an))all[an]=1}}
  for(nm in all){
    var chk=DOCS[nm]||{};
    var grp=slot==="fri"?"금":(slot==="sat"?"토":""),ar=(ATT&&grp)?ATT[grp+"|"+nm]:null;
    if(ar&&ar.status==="left")continue;
    var cls=F.clsOf(nm)||"",mk=chk[slot]||{},ap=chk.app||{};
    var first=mk.tin||"",last=mk.tlt||mk.tin||"",ts=[],k;
    if(first)ts.push(first);if(last)ts.push(last);
    for(k in ap){
      if(k.indexOf("a_")!==0&&k.indexOf("l_")!==0)continue;
      var o=null;try{o=JSON.parse(ap[k])}catch(e){}
      if(o&&o.t)ts.push(o.t);
    }
    if(!ts.length&&!(ar&&ar.status==="in"))continue;
    ts.sort(function(a,b){return tmin(a)-tmin(b)});
    var l0=ts.length?ts[ts.length-1]:"";
    var items=[];try{items=F.itemsFor(cls,slot,nm,TD)||[]}catch(e){}
    var req=items.filter(function(i){return !i.plus});
    var n=req.filter(function(i){return mk[i.id]}).length;
    var nx=req.filter(function(i){return !mk[i.id]})[0];
    var idle=now-tmin(l0);if(idle<0)idle=0;
    var ain="",ov=0;if(ar&&ar.arrive){ov=(Date.now()-ar.arrive>=(slot==="sat"?120:60)*60000)?1:0;var dd=new Date(ar.arrive+32400000);ain=("0"+dd.getUTCHours()).slice(-2)+":"+("0"+dd.getUTCMinutes()).slice(-2)}else if(first)ain=first;
    var st=(req.length&&n>=req.length)?"d":"g";
    out.push({ov:ov,ain:ain,room:(ar&&ar.teacher)?ar.teacher:"",nm:nm,last:l0,idle:idle,req:req,n:n,nx:nx?String(nx.t||""):"",st:st,ck:mk});
  }
  out.sort(function(a,b){return a.nm<b.nm?-1:a.nm>b.nm?1:0});
  return out;
}

function agoTxt(s){
  if(s.st==="d")return "완료";
  if(s.idle<1)return "방금";
  if(s.st==="r")return s.idle+"분째 멈춤";
  return s.idle+"분 전";
}

function tile(s){
  var seg="",i;
  for(i=0;i<s.req.length;i++)seg+='<i class="'+(s.ck[s.req[i].id]?"on":"")+'"></i>';
  return '<div class="t '+s.st+'" data-nm="'+esc(s.nm)+'"><div><div class="nm">'+esc(s.nm)+'</div>'+(s.ain?'<div class="tt'+(s.ov?' ov':'')+'">'+s.ain+'</div>':'')+'<div class="tm">'+(s.req.length?s.n+' / '+s.req.length:'')+'</div></div>'
    +(s.req.length?'<div class="seg">'+seg+'</div>':'<div class="seg"></div>')
    +'</div>';
}

function render(){
  var a=$("app");
  if(!ready()){a.innerHTML='<div class="empty">불러오는 중</div>';return}
  var d=new Date(),dw="일월화수목금토";
  var L0=build(),cn={"":L0.length,"남":0,"여":0};L0.forEach(function(s){if(s.room)cn[s.room]=(cn[s.room]||0)+1});
  var L=(ATT&&ROOM)?L0.filter(function(s){return s.room===ROOM}):L0,c={g:0,y:0,r:0,d:0};L.forEach(function(s){c[s.st]++});
  var tabs=ATT?'<div class="rm">'+[["","전체"],["남","남쌤"],["여","여쌤"]].map(function(x){return '<button type="button" data-room="'+x[0]+'" class="'+(ROOM===x[0]?"on":"")+'">'+x[1]+' '+(cn[x[0]]||0)+'</button>'}).join("")+'</div>':'';
  var h='<div class="top"><h1>'+(d.getMonth()+1)+'/'+d.getDate()+'('+dw[d.getDay()]+') '+hm()+'</h1>'+tabs+'<div class="cnt"><span><b>'+L.length+'</b>명</span><span class="g"><b>'+c.g+'</b>진행</span><span class="d"><b>'+c.d+'</b>완료</span></div></div>';
  if(!L.length){a.innerHTML=h+'<div class="empty">아직 오늘 기록이 없음</div>';return}
  h+='<div class="grid" id="gr">'+L.map(tile).join("")+'</div>';
  a.innerHTML=h;
  var g=$("gr"),W=g.clientWidth,H=g.clientHeight,n=L.length;
  var rows=3,cols=Math.max(5,Math.ceil(n/3));
  var tw=Math.floor((W+10)/cols-10),th=Math.floor((H+10)/rows-10);var u=Math.floor(Math.min(tw/9,th/9,60));if(u<5)u=5;
  g.style.gridTemplateColumns="repeat("+cols+","+tw+"px)";
  g.style.gridTemplateRows="repeat("+rows+","+th+"px)";
  g.style.alignContent="start";g.style.justifyContent="start";
  g.style.setProperty("--u",u+"px");
}

function attTxt(){
  if(!ATT)return ' · 출석부 연결 안 됨(로그인 필요)';
  var g=(F&&F.slotOf(TD)==="sat")?"토":"금",c=0,k;
  for(k in ATT){if(k.indexOf(g+"|")===0&&ATT[k]&&ATT[k].status==="in")c++}
  return ' · 출석부 연결됨, 등원 '+c+'명';
}
function stat(){
  var e=$("st");
  e.innerHTML='<a href="/board/hq/" style="color:#8fb0c6;margin-right:10px;text-decoration:none">관리보드</a>'+esc(STATE)+attTxt()+(!ATT&&AMOD?'<button id="lg" type="button">출석부 로그인</button>':'')+(STOP?'<button id="rs" type="button">다시 시작</button>':'');
  var b=$("rs");if(b)b.onclick=function(){STOP=0;start()};
  var lg=$("lg");if(lg)lg.onclick=function(){try{AMOD.signInWithPopup(AU,new AMOD.GoogleAuthProvider()).catch(function(){})}catch(e){}};
}

var OPEN="";
function detail(){
  var o=$("ov");
  if(!OPEN){if(o)o.remove();return}
  var nm=OPEN,chk=DOCS[nm]||{},slot=F.slotOf(TD),cls=F.clsOf(nm)||"",mk=chk[slot]||{},ap=chk.app||{},items=[],k;
  try{items=F.itemsFor(cls,slot,nm,TD)||[]}catch(e){}
  var h='<div class="pn"><h2>'+esc(nm)+'</h2><div class="sub">'+(mk.tin?esc(mk.tin)+' 시작':'')+(mk.tlt?' · 마지막 체크 '+esc(mk.tlt):'')+'</div>';
  h+=items.map(function(i){var on=mk[i.id];return '<div class="dr'+(on?' ok':'')+'"><em>'+(on?'완료':'전')+'</em>'+esc(i.t)+(i.plus?' (플러스)':'')+(on&&mk["t_"+i.id]?'<small>'+esc(mk["t_"+i.id])+'</small>':'')+'</div>'}).join("");
  var L=[];
  for(k in ap){
    if(k.indexOf("l_")!==0)continue;
    var q=null;try{q=JSON.parse(ap[k])}catch(e){}
    if(q&&q.w)L.push(q);
  }
  L.sort(function(a,b){return tmin(a.t)-tmin(b.t)});
  if(L.length)h+='<div class="ph">앱 활동</div>'+L.map(function(q){return '<div class="dr ok">'+esc(q.w)+(q.t?'<small>'+esc(q.t)+'</small>':'')+'</div>'}).join("");
  h+='</div>';
  if(!o){o=document.createElement("div");o.id="ov";o.className="ov";document.body.appendChild(o);o.addEventListener("click",function(e){if(e.target===o||e.target.className==="ov"){OPEN="";detail()}})}
  o.innerHTML=h;
}
document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest(".t[data-nm]");if(t){OPEN=t.getAttribute("data-nm");detail()}});
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button[data-room]");if(b){ROOM=b.getAttribute("data-room");try{localStorage.setItem("live-room",ROOM)}catch(x){}render()}});
var pend=0;
function later(){if(pend)return;pend=setTimeout(function(){pend=0;render();if(OPEN)detail()},250)}

async function start(){
  try{
    TD=F.iso();
    var {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    var {getFirestore,doc,onSnapshot}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    if(!DB){APP=initializeApp({apiKey:"AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA",authDomain:"nolbada.github.io",projectId:"h-roadmap",appId:"1:575520405083:web:b9f40b64cb0ae3d1a9317e"});DB=getFirestore(APP)}
    if(!AU){var A=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");AMOD=A;AU=A.getAuth(APP);A.onAuthStateChanged(AU,function(u){
      if(u){if(!AUNS)AUNS=onSnapshot(doc(DB,"att","d_"+TD),function(s){if(s.metadata.fromCache)return;var o={};if(s.exists()){try{o=JSON.parse(s.data().j)||{}}catch(e){}}ATT=o;later()},function(){ATT=null;AUNS=null;later()})}
      else{ATT=null;if(AUNS){try{AUNS()}catch(e){}AUNS=null}later()}
    })}
    var k;for(k in SUBS){try{SUBS[k]()}catch(e){}}SUBS={};DOCS={};
    names().forEach(function(n){
      SUBS[n]=onSnapshot(doc(DB,"board",TD+"|"+n),function(s){
        if(s.metadata.fromCache)return;
        var chk=null;
        if(s.exists()){try{chk=JSON.parse(s.data().chk||"{}")}catch(e){chk={}}}
        if(chk)DOCS[n]=chk;else delete DOCS[n];
        later();
      },function(){});
    });
    STATE="연결됨 "+hm();stat();render();
    clearTimeout(TMR);
    TMR=setTimeout(function(){
      var k2;for(k2 in SUBS){try{SUBS[k2]()}catch(e){}}SUBS={};if(AUNS){try{AUNS()}catch(e){}AUNS=null}STOP=1;STATE="연결 종료";stat();
    },MAXH*3600*1000);
  }catch(e){STATE="연결 실패";stat();render()}
}

render();stat();
document.getElementById("df").addEventListener("load",function(){
  F=document.getElementById("df").contentWindow;
  var tries=0,iv=setInterval(function(){
    tries++;
    if(ready()&&(F.CC&&F.CC.cards||tries>16)){clearInterval(iv);start();return}
    if(tries>40){clearInterval(iv);STATE="기본 설정을 불러오지 못함";stat()}
  },500);
});
setInterval(function(){if(ready())render()},30000);
window.addEventListener("resize",function(){if(ready())render()});
</script>
</body>
</html>
