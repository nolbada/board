<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<title>실시간 현황</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0D1E30;color:#eaf1f6;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:10px 14px 12px}
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 10px}
.top h1{font-size:22px;margin:0;font-weight:800}
.cnt{display:flex;gap:18px;font-size:17px;font-weight:700;align-items:baseline}
.cnt b{font-size:28px;margin-right:4px}
.cnt .g b{color:#43d19a}.cnt .y b{color:#f0b64a}.cnt .r b{color:#ff6b61}.cnt .d b{color:#9fb6c6}
.grid{flex:1 1 auto;display:grid;gap:10px;min-height:0}
.t{position:relative;border-radius:14px;background:#16324a;border:2px solid #23496a;padding:calc(var(--u)*.7) calc(var(--u)*.9);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0;min-height:0}
.t .nm{font-size:calc(var(--u)*2.1);font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .tm{font-size:calc(var(--u)*.95);color:#a9c0d0;font-weight:700;margin-top:calc(var(--u)*.2)}
.seg{display:flex;gap:calc(var(--u)*.22);margin:calc(var(--u)*.5) 0}
.seg i{flex:1;height:calc(var(--u)*.7);border-radius:99px;background:#2a4a66}
.seg i.on{background:#43d19a}
.t .nx{font-size:calc(var(--u)*1);font-weight:700;color:#d6e4ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .nx small{color:#8fa9bb;font-weight:600;margin-right:calc(var(--u)*.3)}
.t.y{border-color:#f0b64a;background:#2d2a1c}
.t.y .tm{color:#f0b64a}
.t.y .seg i.on{background:#f0b64a}
.t.r{border-color:#ff6b61;background:#3a1f22;animation:pz 1.6s ease-in-out infinite}
.t.r .tm{color:#ff8a82}
.t.r .seg i.on{background:#ff6b61}
.t.d{background:#1b6b50;border-color:#43d19a}
.t.d .tm,.t.d .nx{color:#d8fbe9}
.t.d .seg i{background:#2f8f6f}.t.d .seg i.on{background:#d8fbe9}
@keyframes pz{0%,100%{box-shadow:0 0 0 0 rgba(255,107,97,0)}50%{box-shadow:0 0 0 6px rgba(255,107,97,.35)}}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:#7f98aa;font-size:22px}
.st{position:fixed;right:10px;bottom:6px;font-size:11px;color:#6f8799}
.st button{border:1px solid #35566f;background:#16324a;color:#cfe0ec;border-radius:99px;padding:4px 10px;font-size:11px;margin-left:6px}
iframe{position:absolute;left:-9999px;top:0;width:10px;height:10px;border:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="st" id="st"></div>
<iframe id="df" src="../index.html" tabindex="-1" aria-hidden="true"></iframe>
<script type="module">
var F=null,DB=null,DOCS={},SUBS={},STATE="준비 중",TMR=0,STOP=0,MAXH=4;
var TD="";
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nowM(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function hm(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function tmin(s){var p=String(s||"").split(":");if(p.length<2)return -1;return (+p[0]||0)*60+(+p[1]||0)}
function ready(){try{return F&&typeof F.itemsFor==="function"&&typeof F.slotOf==="function"&&F.ROSTER&&F.iso}catch(e){return false}}

function names(){
  var out=[],seen={},c;
  for(c in F.ROSTER){
    if(/중3|고등|관리형/.test(c))continue;
    (F.ROSTER[c]||[]).forEach(function(n){if(n&&!/^(시험|샘플|열람)/.test(n)&&!seen[n]){seen[n]=1;out.push(n)}});
  }
  return out;
}

function build(){
  var slot=F.slotOf(TD),out=[],now=nowM(),nm;
  for(nm in DOCS){
    var chk=DOCS[nm];if(!chk)continue;
    var cls=F.clsOf(nm)||"",mk=chk[slot]||{},ap=chk.app||{};
    var first=mk.tin||"",last=mk.tlt||mk.tin||"",ts=[],k;
    if(first)ts.push(first);if(last)ts.push(last);
    for(k in ap){
      if(k.indexOf("a_")!==0&&k.indexOf("l_")!==0)continue;
      var o=null;try{o=JSON.parse(ap[k])}catch(e){}
      if(o&&o.t)ts.push(o.t);
    }
    if(!ts.length)continue;
    ts.sort(function(a,b){return tmin(a)-tmin(b)});
    var l0=ts[ts.length-1];
    var items=[];try{items=F.itemsFor(cls,slot,nm,TD)||[]}catch(e){}
    var req=items.filter(function(i){return !i.plus});
    var n=req.filter(function(i){return mk[i.id]}).length;
    var nx=req.filter(function(i){return !mk[i.id]})[0];
    var idle=now-tmin(l0);if(idle<0)idle=0;
    var st=(req.length&&n>=req.length)?"d":(idle>=15?"r":(idle>=7?"y":"g"));
    out.push({nm:nm,last:l0,idle:idle,req:req,n:n,nx:nx?String(nx.t||""):"",st:st,ck:mk});
  }
  out.sort(function(a,b){return a.nm<b.nm?-1:a.nm>b.nm?1:0});
  return out;
}

function agoTxt(s){
  if(s.st==="d")return "완료";
  if(s.idle<1)return "방금";
  if(s.st==="r")return s.idle+"분째 멈춤";
  return s.idle+"분 전";
}

function tile(s){
  var seg="",i;
  for(i=0;i<s.req.length;i++)seg+='<i class="'+(s.ck[s.req[i].id]?"on":"")+'"></i>';
  return '<div class="t '+s.st+'"><div><div class="nm">'+esc(s.nm)+'</div><div class="tm">'+agoTxt(s)+'</div></div>'
    +(s.req.length?'<div class="seg">'+seg+'</div>':'<div class="seg"></div>')
    +'<div class="nx">'+(s.st==="d"?'<small>모두 완료</small>':(s.nx?'<small>다음</small>'+esc(s.nx):''))+'</div></div>';
}

function render(){
  var a=$("app");
  if(!ready()){a.innerHTML='<div class="empty">불러오는 중</div>';return}
  var d=new Date(),dw="일월화수목금토";
  var L=build(),c={g:0,y:0,r:0,d:0};L.forEach(function(s){c[s.st]++});
  var h='<div class="top"><h1>'+(d.getMonth()+1)+'/'+d.getDate()+'('+dw[d.getDay()]+') '+hm()+'</h1><div class="cnt"><span><b>'+L.length+'</b>명</span><span class="g"><b>'+c.g+'</b>진행</span><span class="y"><b>'+c.y+'</b>주춤</span><span class="r"><b>'+c.r+'</b>멈춤</span><span class="d"><b>'+c.d+'</b>완료</span></div></div>';
  if(!L.length){a.innerHTML=h+'<div class="empty">아직 오늘 기록이 없음</div>';return}
  h+='<div class="grid" id="gr">'+L.map(tile).join("")+'</div>';
  a.innerHTML=h;
  var g=$("gr"),W=g.clientWidth,H=g.clientHeight,n=L.length;
  var cols=Math.max(1,Math.ceil(Math.sqrt(n*W/H))),rows=Math.ceil(n/cols);
  while(cols>1&&Math.ceil(n/(cols-1))===rows)cols--;
  g.style.gridTemplateColumns="repeat("+cols+",minmax(0,1fr))";
  g.style.gridTemplateRows="repeat("+rows+",minmax(0,1fr))";
  var tw=(W-10*(cols-1))/cols,th=(H-10*(rows-1))/rows;
  var u=Math.min(tw/11,th/9.5,34);
  g.style.setProperty("--u",Math.max(8,u)+"px");
}

function stat(){
  var e=$("st");
  e.innerHTML='<a href="/board/hq/" style="color:#8fb0c6;margin-right:10px;text-decoration:none">관리보드</a>'+esc(STATE)+(STOP?'<button id="rs" type="button">다시 시작</button>':'');
  var b=$("rs");if(b)b.onclick=function(){STOP=0;start()};
}

var pend=0;
function later(){if(pend)return;pend=setTimeout(function(){pend=0;render()},250)}

async function start(){
  try{
    TD=F.iso();
    var {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    var {getFirestore,doc,onSnapshot}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    if(!DB)DB=getFirestore(initializeApp({apiKey:"AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA",projectId:"h-roadmap",appId:"1:575520405083:web:b9f40b64cb0ae3d1a9317e"},"board-live"));
    var k;for(k in SUBS){try{SUBS[k]()}catch(e){}}SUBS={};DOCS={};
    names().forEach(function(n){
      SUBS[n]=onSnapshot(doc(DB,"board",TD+"|"+n),function(s){
        if(s.metadata.fromCache)return;
        var chk=null;
        if(s.exists()){try{chk=JSON.parse(s.data().chk||"{}")}catch(e){chk={}}}
        if(chk)DOCS[n]=chk;else delete DOCS[n];
        later();
      },function(){});
    });
    STATE="연결됨 "+hm();stat();render();
    clearTimeout(TMR);
    TMR=setTimeout(function(){
      var k2;for(k2 in SUBS){try{SUBS[k2]()}catch(e){}}SUBS={};STOP=1;STATE="연결 종료";stat();
    },MAXH*3600*1000);
  }catch(e){STATE="연결 실패";stat();render()}
}

render();stat();
document.getElementById("df").addEventListener("load",function(){
  F=document.getElementById("df").contentWindow;
  var tries=0,iv=setInterval(function(){
    tries++;
    if(ready()&&(F.CC&&F.CC.cards||tries>16)){clearInterval(iv);start();return}
    if(tries>40){clearInterval(iv);STATE="기본 설정을 불러오지 못함";stat()}
  },500);
});
setInterval(function(){if(ready())render()},30000);
window.addEventListener("resize",function(){if(ready())render()});
</script>
</body>
</html>
