<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>성적 기록</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:#f4f6f7;color:#1c2b2d;font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 70px}
h1{font-size:21px;margin:0 0 14px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:13px;color:#5b6b6e;margin:18px 0 6px}
a{color:#0b6e73}
button,select,input{font:inherit}
button{border:1px solid #b9c4c6;background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;color:#1c2b2d}
button.pri{background:#0d3b44;border-color:#0d3b44;color:#fff}
button.sm{padding:3px 9px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
input,select{border:1px solid #b9c4c6;border-radius:8px;padding:6px 9px;background:#fff}
nav{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
nav button.on{background:#0d3b44;color:#fff;border-color:#0d3b44}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.card{background:#fff;border:1px solid #dde3e5;border-radius:12px;padding:12px 14px;cursor:pointer}
.card:hover{background:#eef7f7}
.card b{font-size:16px}
.card .m{font-size:12.5px;color:#6a7a7d;margin-top:2px}
.card .k{font-size:13px;margin-top:6px}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 6px;margin-left:4px;background:#fdecc8;color:#7a4a00}
.tag.g{background:#e3efe9;color:#1f5c44}
.box{background:#fff;border:1px solid #dde3e5;border-radius:12px;padding:12px 14px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid #e6ebec;padding:6px 6px;text-align:left;vertical-align:top}
th{color:#5b6b6e;font-weight:600;font-size:12.5px}
tr.rv td{background:#fff8e6}
.muted{color:#7a8a8d;font-size:13px}
svg text{font-family:inherit}
.hide{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rec{background:#fff;border:1px solid #dde3e5;border-left:6px solid var(--c);border-radius:10px;padding:9px 12px;margin-bottom:7px;display:flex;gap:12px;align-items:center}
.rec .dt{width:104px;font-size:12.5px;color:#6a7a7d;flex:none}
.rec .mid{flex:1;min-width:0}
.rec .sc{font-size:19px;font-weight:700;color:var(--c);white-space:nowrap}
.rec .lb{font-size:12.5px;color:#4b5b5e}
.rec .raw{font-size:12px;color:#8a9a9d}
.rec.rv{background:#fffaf0}
.dots{display:flex;gap:4px;margin-top:7px}
.dot{width:9px;height:9px;border-radius:50%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:#5b6b6e;margin:0 0 10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rk{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dde3e5;border-radius:10px;padding:7px 12px;margin-bottom:6px;cursor:pointer}
.rk:hover{background:#eef7f7}
.rk .n{width:30px;text-align:center;font-weight:700;color:#5b6b6e}
.rk .nm{width:150px;flex:none}
.rk .nm small{display:block;color:#7a8a8d;font-size:11.5px}
.rk .bar2{flex:1;height:12px;background:#eef1f2;border-radius:6px;overflow:hidden}
.rk .bar2 b{display:block;height:100%;border-radius:6px}
.rk .v{width:84px;text-align:right;font-weight:700}
.rk .d{width:78px;text-align:right;font-size:12px;color:#8a9a9d}
.rec.nl{flex-wrap:wrap}
.rec.nl{cursor:pointer}.rec.nl .nd,.rec.nl .nt{display:none}.rec.nl.op .nd{display:grid}.rec.nl.op .nt{display:block}.rec.nl .lb::after{content:' \25BE';color:#8A9A9D}.rec.nl.op .lb::after{content:' \25B4'}
.nd{flex-basis:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;padding-top:9px;border-top:1px dashed #eadfc9}
.nd>div{background:#fff8ec;border-radius:8px;padding:6px 9px}
.nd b{display:block;font-size:11.5px;color:#9a6200;font-weight:600}
.nd span{display:block;font-size:12.5px;color:#3a4a4d;margin:1px 0 4px}
.nd i{display:block;height:5px;border-radius:3px;background:#f0e2c8;overflow:hidden}
.nd u{display:block;height:100%;background:#7A45D1}
.nd em{display:block;font-style:normal;font-size:12px;font-weight:700;color:#7A45D1;margin-top:3px}
.nt{flex-basis:100%;font-size:12px;color:#8a9a9d}
@media(max-width:560px){.nd{grid-template-columns:repeat(2,1fr)}}
.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hd h2{font-size:26px;margin:0}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:12px 0 14px}
.st{background:#fff;border:1px solid #dde3e5;border-top:4px solid var(--c);border-radius:10px;padding:10px 12px}
.st b{display:block;font-size:24px;color:var(--c)}
.st span{display:block;font-size:12.5px;color:#5b6b6e}
.st em{display:block;font-style:normal;font-size:12px;color:#8a9a9d;margin-top:2px}
.yr{font-size:13px;font-weight:700;color:#5b6b6e;margin:16px 0 6px;padding-left:2px}
@media(max-width:560px){.sts{gap:6px}.st{padding:8px 8px 7px;border-radius:9px}.st b{font-size:19px}.st span{font-size:11.5px;margin-top:1px}.st em{font-size:10.5px;line-height:1.35}}
#flt button.on{background:#0d3b44;color:#fff;border-color:#0d3b44}
.ok{color:#1f7a5c}
.err{color:#b3261e}

.rec .raw{word-break:keep-all}

.ent{background:#fff;border:2px solid #0d3b44;border-radius:14px;padding:14px 16px;margin:0 0 16px}
.ent b{font-size:17px;display:block;margin-bottom:8px}
.ent .r{display:flex;gap:8px}
.ent input{flex:1;min-width:0;font-size:18px;padding:10px 12px}
.ent button{font-weight:700;padding:10px 18px}
.ent .w{color:#5b6b6e;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="out"><div class="muted">불러오는 중</div></div>
<script type="module">
var V='https://www.gstatic.com/firebasejs/10.14.1/';
var A=await import(V+'firebase-app.js');
var F=await import(V+'firebase-firestore.js');
var app=A.initializeApp({apiKey:'AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA',authDomain:'nolbada.github.io',projectId:'h-roadmap',appId:'1:575520405083:web:b9f40b64cb0ae3d1a9317e'},'scv');
var db=F.getFirestore(app);
function $(i){return document.getElementById(i)}
function needRev(){return false}
var WD=['일','월','화','수','목','금','토'];
var CC={school:'#CF1F4F',natl:'#2F6FD6',mock:'#2E9E6B',acad:'#8CB82B',nelt:'#7A45D1',entry:'#8A9A9D'};
var CN={school:'학교 시험',natl:'전국 모의고사',mock:'학원 모고',acad:'학원 영역별 시험',nelt:'넬트',entry:'입회 시'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fd(d){var p=String(d).split('-');if(p.length<3)return esc(d);var t=new Date(+p[0],+p[1]-1,+p[2]);return esc(d)+'('+WD[t.getDay()]+')'}
function val(r){if(!r.v)return null;if(r.c==='nelt'||r.c==='entry')return r.v.p!=null?r.v.p:(r.v.s!=null?r.v.s:null);return r.v.s!=null?r.v.s:null}
document.addEventListener('click',function(e){var c=e.target.closest&&e.target.closest('.rec.nl');if(c&&!e.target.closest('button'))c.classList.toggle('op')});
function nl(r){var m=String(r.r||'').match(/레벨\s*\d*\s*((?:초|중|고)\d)(?:~(?:초|중|고)?\d)?(?:\s*수준)?(?:\s+((?:초|중|고)\d))?/);return m?{l:m[1],t:m[2]||''}:{l:'',t:''}}
function disp(r){var x=val(r);if(r.c==='nelt'||r.c==='entry'){if(r.v&&r.v.p!=null)return '상위 '+r.v.p+'%';return x!=null?String(x):''}return x!=null?x+'점':(r.v&&r.v.wc!=null?r.v.wc+'개 틀림':'')}
function legend(){var f=function(a){return a.map(function(k){return '<span><i style="background:'+CC[k]+'"></i>'+CN[k]+'</span>'}).join('')};return '<div class="leg" style="margin-bottom:4px">'+f(['school','natl','nelt'])+'</div><div class="leg">'+f(['mock','acad'])+'</div>'}
function pn(m){if(!m)return null;var o=[],re=/(어휘|문법|듣기|독해)\s+([^/]*?)\s*\(\s*상위\s*(\d+)\s*%\s*\)/g,x;while((x=re.exec(m)))o.push({k:x[1],l:x[2].trim(),p:+x[3]});var tm=m.match(/총\s*([^.]+)$/);return o.length?{o:o,t:tm?tm[1].trim():''}:null}
function ndHtml(nd){return '<div class="nd">'+nd.o.map(function(q){return '<div><b>'+q.k+'</b><span>'+esc(q.l)+'</span><i><u style="width:'+Math.max(4,100-q.p)+'%"></u></i><em>상위 '+q.p+'%</em></div>'}).join('')+'</div>'+(nd.t?'<div class="nt">소요 시간 '+esc(nd.t)+'</div>':'')}
function recCard(r,i,edit){var sc=disp(r),nd=r.c==='nelt'?pn(r.m):null,lv=nd?String(r.r||'').replace(/\(\s*상위[^)]*\)/,'').trim():r.t;return '<div class="rec'+(needRev(r)?' rv':'')+(nd?' nl':'')+'" style="--c:'+(CC[r.c]||'#8A9A9D')+'" data-i="'+i+'"><div class="dt">'+fd(r.d)+'</div><div class="mid"><div class="lb">'+esc(CN[r.c]||r.t)+(r.c==='nelt'?(((r.v&&r.v.tg)||nl(r).t)?' · '+esc((r.v&&r.v.tg)||nl(r).t)+' 응시':''):(/^(학원|학원\(모고\)|전국\(모고\)|넬트|입회)$/.test(r.t)?'':' · '+esc(r.t)))+(r.n?' · '+esc(r.n):'')+(r.src==="student"?'<span class="tag g">학생 입력</span>':'')+(needRev(r)?'<span class="tag">확인 필요</span>':'')+'</div>'+(r.c==='nelt'&&((r.v&&r.v.lb)||nl(r).l||(r.v&&r.v.lv))?'<div class="raw">'+(r.v&&r.v.lv?'LV'+esc(r.v.lv):'레벨')+(((r.v&&r.v.lb)||nl(r).l)?' ('+esc((r.v&&r.v.lb)||nl(r).l)+' 수준)':'')+'</div>':'')+(!nd&&r.c!=='nelt'&&r.c!=='entry'&&r.r&&r.r!==sc&&!(/^[0-9.]+\s*점?$/.test(String(r.r).trim())&&r.v&&r.v.s!=null)?'<div class="raw">'+esc(r.r)+'</div>':'')+(r.m&&!nd?'<div class="raw">'+esc(r.m)+'</div>':'')+'</div><div class="sc">'+esc(sc||r.r)+'</div>'+(edit?'<button class="sm" data-act="edit" data-i="'+i+'">수정</button>':'')+(nd?ndHtml(nd):'')+'</div>'}
function stat(c,v,l,sub){return '<div class="st" style="--c:'+c+'"><b>'+v+'</b><span>'+l+'</span>'+(sub?'<em>'+sub+'</em>':'')+'</div>'}
function span(from){var a=String(from||'').split('-');if(a.length<2)return '';var n=new Date(),m=(n.getFullYear()-(+a[0]))*12+n.getMonth()+1-(+a[1]);if(m<1)return '';var y=Math.floor(m/12),mo=m%12;return (y?y+'년 ':'')+(mo?mo+'개월':'')}
function nums(s,cats,key){return s.rec.filter(function(r){return cats.indexOf(r.c)>=0&&r.v&&r.v[key]!=null}).map(function(r){return r.v[key]})}
function avg(a){var t=0;a.forEach(function(x){t+=x});return Math.round(t/a.length*10)/10}
function chart(title,pts,o){
  if(!pts.length)return '';
  var W=640,H=190,L=34,R=14,T=14,B=34,min=o.min,max=o.max;
  function X(i){return pts.length===1?(L+W-R)/2:L+(W-L-R)*i/(pts.length-1)}
  function Y(v){var f=(v-min)/(max-min);if(o.inv)f=1-f;return T+(H-T-B)*(1-f)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(title)+'">';
  o.grid.forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#e3e8e9"/><text x="'+(L-5)+'" y="'+(Y(v)+4)+'" font-size="11" text-anchor="end" fill="#7a8a8d">'+v+'</text>'});
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i)+' '+Y(p.y)}).join(' ');
  s+='<path d="'+d+'" fill="none" stroke="'+o.color+'" stroke-width="2"/>';
  var step=Math.ceil(pts.length/9);
  pts.forEach(function(p,i){
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="3.5" fill="'+(p.warn?'#fff':o.color)+'" stroke="'+o.color+'" stroke-width="2"/>';
    s+='<text x="'+X(i)+'" y="'+(Y(p.y)-8)+'" font-size="11" text-anchor="middle" fill="#1c2b2d">'+esc(p.y)+'</text>';
    if(i%step===0)s+='<text x="'+X(i)+'" y="'+(H-14)+'" font-size="10.5" text-anchor="middle" fill="#6a7a7d">'+esc(p.x)+'</text>';
  });
  s+='</svg>';
  return '<div class="box"><h3 style="margin-top:0">'+esc(title)+'</h3>'+s+(o.note?'<div class="muted">'+o.note+'</div>':'')+'</div>';
}
function pts(s,cat,key){
  var cs=[].concat(cat);return s.rec.filter(function(r){return cs.indexOf(r.c)>=0&&r.v&&r.v[key]!=null}).map(function(r){return {x:r.d.slice(2,7).replace('-','.'),y:r.v[key],warn:needRev(r)||(r.f||[]).indexOf('날짜임의?')>=0}});
}


var CFG=null;try{var cs=await F.getDoc(F.doc(db,'sc_cfg','cur'));if(cs.exists())CFG=cs.data()}catch(e){}
var k=new URLSearchParams(location.search).get('k')||'';
var d=null;
try{if(k.length>=24){var sn=await F.getDoc(F.doc(db,'sc_p',k));if(sn.exists())d=sn.data()}}catch(e){}
if(!d){$('out').innerHTML='<div class="box">링크를 확인해 주세요.</div>'}
else{
  var s=d,h='<div id="ent"></div>',st='';
  var sc=nums(s,['school'],'s'),nt=nums(s,['natl'],'s'),ne=nums(s,['nelt'],'p'),mk=nums(s,['mock'],'s'),ak=nums(s,['acad'],'s');
  if(sc.length){var pf=sc.filter(function(x){return x>=100}).length;st+=stat(CC.school,avg(sc),'학교 시험 평균',sc.length+'회'+(pf?' · 100점 '+pf+'회':''))}
  if(nt.length){st+=stat(CC.natl,avg(nt),'전국 모고 평균',nt.length+'회 · 최근 '+nt[nt.length-1])}
  if(ne.length){st+=stat(CC.nelt,'상위 '+ne[ne.length-1]+'%','넬트 최근',ne.length>1?'처음 상위 '+ne[0]+'% · 최고 상위 '+Math.min.apply(null,ne)+'%':'')}
  if(mk.length){st+=stat(CC.mock,avg(mk),'학원 모고 평균',mk.length+'회 · 최근 '+mk[mk.length-1])}
  if(ak.length){st+=stat(CC.acad,avg(ak),'학원 영역별 평균',ak.length+'회 · 최근 '+ak[ak.length-1])}
  h+='<div class="hd"><h2>'+esc(s.name)+'</h2><span class="muted">'+esc(s.school)+'</span></div><div class="muted">'+(span(s.joined)?'함께한 지 '+span(s.joined):'')+'</div>';
  if(st)h+='<div class="sts" style="grid-template-columns:repeat(2,1fr)">'+st+'</div>';
  h+=chart('학교 시험 점수',pts(s,['school'],'s'),{min:0,max:100,grid:[0,50,100],color:'#CF1F4F'});
  h+=chart('전국 모고 점수',pts(s,['natl'],'s'),{min:0,max:100,grid:[0,50,100],color:'#2F6FD6'});
  h+=chart('학원 모고 점수',pts(s,['mock'],'s'),{min:0,max:100,grid:[0,50,100],color:'#2E9E6B'});
  h+=chart('학원 영역별 점수',pts(s,['acad'],'s'),{min:0,max:100,grid:[0,50,100],color:'#8CB82B'});
  h+=chart('넬트 상위 % (위로 갈수록 좋음)',pts(s,'nelt','p'),{min:0,max:100,grid:[0,25,50,75,100],color:'#7A45D1',inv:true});
  var SG={school:['school'],natl:['natl'],mock:['mock'],acad:['acad'],nelt:['nelt']},SN={all:'전체',school:'학교 시험',natl:'전국 모의고사',mock:'학원 모고',acad:'학원 영역별',nelt:'넬트'};
  function cnt(f){return f==='all'?s.rec.length:s.rec.filter(function(r){return SG[f].indexOf(r.c)>=0}).length}
  var hi=/고/.test(s.school||''),B=function(f){return '<button class="sm'+(f==='all'?' on':'')+'" data-f="'+f+'">'+SN[f]+(f==='all'||cnt(f)>0?' '+cnt(f):'')+'</button>'};
  var r1=['all','school'].concat(hi||cnt('natl')>0?['natl']:[],['nelt']),r2=(hi||cnt('mock')>0?['mock']:[]).concat(['acad']);
  var bt=r1.map(B).join(' ')+'<div style="margin-top:6px">'+r2.map(B).join(' ')+'</div>';
  h+='<h3>기록 (최신순)</h3>'+legend()+'<div id="flt" style="margin:0 0 10px">'+bt+'</div><div id="lst"></div>';
  $('out').innerHTML=h;
  function drawList(f){var o='',yr='';for(var i=s.rec.length-1;i>=0;i--){var r=s.rec[i];if(f!=='all'&&SG[f].indexOf(r.c)<0)continue;var y=String(r.d).slice(0,4);if(y!==yr){yr=y;o+='<div class="yr">'+y+'</div>'}o+=recCard(r,i,false)}$('lst').innerHTML=o}
  drawList('all');
  (function(){
    var box=$('ent');if(!CFG||CFG.open!==true||!CFG.x){box.style.display='none';return}
    var X=String(CFG.x),key='scsub:'+k+':'+X,done=false;
    try{done=localStorage.getItem(key)==='1'}catch(e){}
    function pend(){box.className='ent';box.innerHTML='<b>'+esc(X)+' 점수</b><div class="w">제출했습니다. 선생님 승인을 기다리는 중입니다.</div>'}
    if(done){pend();return}
    box.className='ent';
    box.innerHTML='<b>'+esc(X)+' 점수 입력</b><div class="r"><input id="esc" type="number" inputmode="decimal" min="0" max="100" step="0.1" placeholder="점수"><button class="pri" id="ego">제출</button></div><div class="err" id="eer" style="margin-top:6px;font-size:14px"></div>';
    $('ego').onclick=async function(){
      var v=parseFloat($('esc').value);$('eer').textContent='';
      if(isNaN(v)||v<0||v>100){$('eer').textContent='점수를 0에서 100 사이로 넣어 주세요';return}
      $('ego').disabled=true;
      var a=new Uint8Array(0);
      try{
        await F.setDoc(F.doc(db,'sc_in','p'+k),{n:s.name,x:X,s:String(v),t:Date.now(),k:k});
        try{localStorage.setItem(key,'1')}catch(e){}
        pend();
      }catch(e){
        $('ego').disabled=false;$('eer').textContent='제출하지 못했습니다. 이미 제출했거나 입력 기간이 끝났을 수 있습니다.';
      }
    };
  })();
  $('flt').addEventListener('click',function(e){var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(!f)return;[].forEach.call($('flt').querySelectorAll('button'),function(x){x.className='sm'+(x===e.target?' on':'')});drawList(f)});
}
</script>
</body>
</html>
