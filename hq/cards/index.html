<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#00A1A7">
<title>카드 · 학생 지정</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f7;color:#1c2b2d;font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:14px 14px 70px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hd a{color:#00828a;text-decoration:none;font-weight:700;font-size:14px}
.hd .tt{font-size:20px;font-weight:700;flex:1}
.hd .lk{font-size:13px;font-weight:700;color:#00828a;border:1px solid #cfe3e4;background:#fff;border-radius:999px;padding:6px 12px}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tab{border:1px solid #dde3e5;background:#fff;border-radius:999px;padding:9px 18px;font-weight:700;color:#5b6b6e}
.tab.on{background:#1c2b2d;color:#fff;border-color:#1c2b2d}
.two{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start}
.side{background:#fff;border:1px solid #dde3e5;border-radius:14px;padding:12px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.main{min-width:0}
.q{width:100%;border:1px solid #dde3e5;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #dde3e5;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:#5b6b6e}
.chip.on{background:#00A1A7;border-color:#00A1A7;color:#fff}
.chip.warn{border-color:#c22e1c;color:#c22e1c}
.chip.warn.on{background:#c22e1c;color:#fff}
.nl{display:flex;flex-direction:column;margin-top:8px}
.nm{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid #eef1f1;background:none;padding:11px 6px;font-weight:700;font-size:16px}
.nm.on{background:#e3f4f5}
.nm small{margin-left:auto;font-weight:500;color:#7a8a8d;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#d97706;flex:none}
.card{background:#fff;border:1px solid #dde3e5;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:#5b6b6e}
.big{font-size:22px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;background:#eef1f1;color:#5b6b6e;border-radius:999px;padding:3px 9px}
.lbl{font-size:13px;color:#6a7a7d;margin:12px 0 6px}
.slot{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid #eef1f1}
.slot:first-of-type{border-top:0}
.slot .sn{font-weight:700}
.slot select{width:100%;border:1px solid #cfd8da;border-radius:10px;padding:9px 10px;background:#fff}
.slot .hint{grid-column:2;font-size:12.5px;color:#6a7a7d}
.slot .sk{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid #cfd8da;border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 16px;font-weight:700;color:#5b6b6e}
.seg button.on{background:#1c2b2d;color:#fff}
input[type=date]{border:1px solid #cfd8da;border-radius:10px;padding:8px 10px;margin-left:8px}
details summary{cursor:pointer;color:#00828a;font-size:13px;font-weight:700}
.btn{border:1px solid #cfd8da;background:#fff;border-radius:10px;padding:9px 14px;font-weight:700}
.btn.pri{background:#00A1A7;border-color:#00A1A7;color:#fff}
.btn.red{border-color:#c22e1c;color:#c22e1c}
.btn.red.on{background:#c22e1c;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.ov{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.cl{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.cb{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid #dde3e5;background:#fff;border-radius:12px;padding:11px 12px;width:100%;font-weight:700}
.cb.on{border-color:#00A1A7;background:#e3f4f5}
.cb small{margin-left:auto;font-weight:500;color:#7a8a8d;font-size:12px}
.edit{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.it{display:grid;grid-template-columns:26px 1fr auto;gap:6px 8px;align-items:center;padding:9px 0;border-top:1px solid #eef1f1}
.it:first-of-type{border-top:0}
.it .no{font-weight:700;color:#7a8a8d;text-align:center}
.it input[type=text]{width:100%;border:1px solid #cfd8da;border-radius:9px;padding:9px 10px}
.it .sub{grid-column:2;display:flex;gap:8px;align-items:center}
.it .sub input[type=text]{flex:1;font-size:13px;padding:7px 9px}
.it .sub label{font-size:12.5px;color:#5b6b6e;white-space:nowrap;display:flex;align-items:center;gap:4px}
.it .ops{display:flex;gap:4px}
.it .ops button{border:1px solid #cfd8da;background:#fff;border-radius:8px;width:32px;height:32px;font-weight:700;padding:0}
.pv{background:#F1F3F0;border-radius:14px;padding:12px}
.pv .pi{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #dcdcdc;background:#fff}
.pv .pi:last-child{border-bottom:0}
.pv .pb{width:26px;height:26px;border-radius:50%;border:2px dashed #cdd;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#7a8a8d}
.pv .pt{font-weight:700;font-size:15px}
.pv .pt small{display:block;font-weight:500;color:#7a8a8d;font-size:12px}
.pv .pbox{background:#fff;border-radius:14px;padding:4px 10px}
.mx{width:100%;border-collapse:collapse}
.mx th,.mx td{padding:8px 6px;border-top:1px solid #eef1f1;text-align:left;font-size:13px}
.mx th{color:#6a7a7d;font-weight:700;border-top:0}
.mx select{width:100%;border:1px solid #cfd8da;border-radius:8px;padding:7px 6px;background:#fff;min-width:110px}
.empty{color:#7a8a8d;padding:30px 10px;text-align:center}
.add{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.add input{flex:1;min-width:80px;border:1px solid #dde3e5;border-radius:10px;padding:9px 10px}
.add select{border:1px solid #dde3e5;border-radius:10px;padding:9px 6px;background:#fff}
#sv{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.mbk{display:none}
@media(max-width:760px){
  .two,.edit{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .two.sel .side{display:none}
  .mbk{display:inline-block;margin-bottom:8px}
  .slot{grid-template-columns:1fr}
  .slot .hint{grid-column:1}
  .mxw{overflow-x:auto}
}
</style>
</head>

function seedCards(){
  var mk=SEED.CARDS.filter(function(x){return x.id==="mk"})[0];
  var o={v:1,u:0,cards:[
    {id:"reg-basic",name:"정규 기본",items:cl(SEED.REGULAR)},
    {id:"reg-m6a",name:"정규 · 독해진도 (M초6A)",items:cl(SEED.CLASS_ITEMS["M초6A"]||SEED.REGULAR)},
    {id:"reg-t1a",name:"정규 · 중1 화목A",items:cl(SEED.CLASS_ITEMS["T중1A"]||SEED.REGULAR)},
    {id:"fri-a",name:"금요일 기본",items:cl(SEED.FRI_A||[])},
    {id:"nohw",name:"숙제 안 가져왔을 때",items:[]},
    {id:"mk",name:"보충 왔을 때",items:cl(mk?mk.items:[])}
  ],cls:{},st:{},day:{}};
  Object.keys(SEED.ROSTER).forEach(function(c){o.cls[c]={reg:c==="M초6A"?"reg-m6a":c==="T중1A"?"reg-t1a":"reg-basic",nohw:"nohw",mk:"mk"}});
  (CFG.f||Object.keys(SEED.FRI_BY)).forEach(function(n){o.st[n]={fri:"fri-a"}});
  Object.keys(CFG.s||{}).forEach(function(n){if(CFG.s[n]&&CFG.s[n].length){o.st[n]=o.st[n]||{};o.st[n].skip=CFG.s[n].slice()}});
  return o;
}
/* 카드 설정 저장: 바꾸는 즉시 자동 저장 */
function markC(){CC.u=Date.now();dirtyC=true;clearTimeout(saveT);saveT=setTimeout(flushC,500);toast("저장 중")}
function flushC(){
  if(!dirtyC)return;
  var d0=iso(new Date(Date.now()-14*86400000));
  Object.keys(CC.day||{}).forEach(function(d){if(d<d0)delete CC.day[d]});
  var sent=CC.u;
  putRec(CCK,CC).then(function(){if(CC.u===sent){dirtyC=false}toast("저장됨")}).catch(function(){toast("저장 실패, 다시 시도합니다");setTimeout(flushC,3000)});
}
function rosterEdit(fn){
  toast("저장 중");
  return getRec(CFGK).then(function(cur){
    if(cur)CFG=normCfg(cur);
    fn(CFG);CFG.u=Date.now();
    return putRec(CFGK,CFG);
  }).then(function(){toast("저장됨")}).catch(function(){toast("저장 실패, 다시 눌러 주세요")}).then(function(){render()});
}

/* ---------- 계산 ---------- */
function clsOf(n){for(var c in CFG.r)if(CFG.r[c].indexOf(n)>-1)return c;return ""}
function allNames(){var a=[];for(var c in CFG.r)CFG.r[c].forEach(function(n){a.push({n:n,c:c})});a.sort(function(x,y){return x.n.localeCompare(y.n,"ko")});return a}
function cardBy(id){return CC.cards.filter(function(x){return x.id===id})[0]}
function pickSrc(cls,slot,name,date){
  var v=CC.day&&CC.day[date]&&CC.day[date][name]&&CC.day[date][name][slot];if(v)return {id:v,src:"이 날만"};
  v=CC.st[name]&&CC.st[name][slot];if(v)return {id:v,src:"개별 지정"};
  v=CC.cls[cls]&&CC.cls[cls][slot];if(v)return {id:v,src:"반 기본"};
  return {id:"",src:""};
}
function cname(id){return id==="-"||!id?"없음":(cardBy(id)?cardBy(id).name:"(지워진 카드)")}
function hasOverride(n){return !!(CC.st[n]&&(CC.st[n].reg||CC.st[n].fri||CC.st[n].sat||CC.st[n].nohw||CC.st[n].mk||(CC.st[n].skip&&CC.st[n].skip.length)))}
function cardOpts(sel,first){
  return '<option value=""'+(sel===""?' selected':'')+'>'+esc(first)+'</option>'+CC.cards.map(function(c){return '<option value="'+esc(c.id)+'"'+(sel===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join("")+'<option value="-"'+(sel==="-"?' selected':'')+'>카드 없음</option>';
}
function usage(id){
  var n=0,k,s;
  for(k in CC.cls)for(s in CC.cls[k])if(CC.cls[k][s]===id)n++;
  for(k in CC.st)for(s in CC.st[k])if(s!=="skip"&&CC.st[k][s]===id)n++;
  return n;
}

/* ---------- 화면 ---------- */
function render(){
  var app=document.getElementById("app");
  if(!loaded)return;
  var h='<div class="tabs"><button class="tab'+(S.tab==="stu"?' on':'')+'" data-tab="stu">학생</button><button class="tab'+(S.tab==="card"?' on':'')+'" data-tab="card">카드</button><button class="tab'+(S.tab==="cls"?' on':'')+'" data-tab="cls">반 기본</button></div>';
  h+=S.tab==="stu"?viewStu():S.tab==="card"?viewCard():viewCls();
  app.innerHTML=h;
}
function viewStu(){
  var cls=Object.keys(CFG.r),list=allNames().filter(function(x){return (!S.cls||x.c===S.cls)&&(!S.q||x.n.indexOf(S.q)>-1)});
  var h='<div class="two'+(S.sel?' sel':'')+'"><div class="side"><input class="q" id="q" placeholder="이름 찾기" value="'+esc(S.q)+'">';
  h+='<div class="chips"><button class="chip'+(!S.cls?' on':'')+'" data-fc="">전체</button>'+cls.map(function(c){return '<button class="chip'+(S.cls===c?' on':'')+'" data-fc="'+esc(c)+'">'+esc(c)+'</button>'}).join("")+'</div>';
  h+='<div class="nl">'+list.map(function(x){return '<button class="nm'+(S.sel===x.n?' on':'')+'" data-sel="'+esc(x.n)+'">'+esc(x.n)+(hasOverride(x.n)?'<span class="dot"></span>':'')+'<small>'+esc(x.c)+'</small></button>'}).join("")+'</div>';
  h+='<div class="add"><input id="addn" maxlength="8" placeholder="새 학생 이름"><select id="addc">'+cls.map(function(c){return '<option'+((S.cls||cls[0])===c?' selected':'')+'>'+esc(c)+'</option>'}).join("")+'</select><button class="btn pri sm" data-add="1">추가</button></div>';
  h+='</div><div class="main">';
  h+=S.sel&&clsOf(S.sel)?detail(S.sel):'<div class="empty">왼쪽에서 학생을 눌러 주세요</div>';
  return h+'</div></div>';
}
function detail(n){
  var c=clsOf(n),cls=Object.keys(CFG.r),h='<button class="btn mbk" data-back="1">‹ 목록</button>';
  h+='<div class="card"><div class="row"><span class="big">'+esc(n)+'</span><span class="tag">'+esc(c)+'</span></div>';
  h+='<div class="lbl">반 옮기기</div><div class="chips">'+cls.filter(function(x){return x!==c}).map(function(x){return '<button class="chip" data-mv="'+esc(x)+'">'+esc(x)+'</button>'}).join("")+'</div>';
  h+='<div class="lbl">퇴원</div><button class="btn red'+(S.cf==="rm"?' on':'')+'" data-rm="1">'+(S.cf==="rm"?'한 번 더 누르면 명단에서 빠져요':'명단에서 빼기')+'</button></div>';
  var day=S.scope==="day",date=day?S.sdate:iso();
  h+='<div class="card"><h3>카드 지정</h3><div class="row"><div class="seg"><button class="'+(!day?'on':'')+'" data-sc="keep">계속</button><button class="'+(day?'on':'')+'" data-sc="day">이 날만</button></div>';
  if(day)h+='<input type="date" id="sd" value="'+esc(S.sdate)+'"><span class="tag">'+dlabel(S.sdate)+'</span>';
  h+='</div>';
  SLOTS.forEach(function(sl){
    var slot=sl[0],cur=day?((CC.day[date]&&CC.day[date][n]&&CC.day[date][n][slot])||""):((CC.st[n]&&CC.st[n][slot])||"");
    var eff=pickSrc(c,slot,n,date),first=day?"계속 설정 따르기":"반 기본 따르기";
    var ef=cardBy(eff.id);
    h+='<div class="slot"><div class="sn">'+sl[1]+'</div><select data-set="'+slot+'">'+cardOpts(cur,first)+'</select>';
    h+='<div class="hint">적용 중: '+esc(cname(eff.id))+(eff.src?' · '+eff.src:'')+'</div>';
    if(ef&&ef.items.length){
      var sk=(CC.st[n]&&CC.st[n].skip)||[];
      h+='<div class="sk"><details><summary>이 학생만 빼기'+(sk.length?' ('+sk.filter(function(id){return ef.items.some(function(i){return i.id===id})}).length+')':'')+'</summary><div class="chips" style="margin-top:8px">'+ef.items.map(function(i){var off=sk.indexOf(i.id)>-1;return '<button class="chip'+(off?' warn on':'')+'" data-skip="'+esc(i.id)+'">'+esc((i.t||"(빈 항목)").replace(/\s*\(.*$/,""))+(off?' · 뺌':'')+'</button>'}).join("")+'</div></details></div>';
    }
    h+='</div>';
  });
  var ovs=[],d0=iso();
  Object.keys(CC.day||{}).sort().forEach(function(d){if(d>=d0&&CC.day[d][n])Object.keys(CC.day[d][n]).forEach(function(s){ovs.push({d:d,s:s,id:CC.day[d][n][s]})})});
  if(ovs.length){
    h+='<div class="lbl">이 날만 지정된 것</div>'+ovs.map(function(o){var sn=SLOTS.filter(function(x){return x[0]===o.s})[0];return '<div class="ov"><b>'+dlabel(o.d)+'</b> '+esc(sn?sn[1]:o.s)+' → '+esc(cname(o.id))+' <button class="btn sm" data-dx="'+o.d+'|'+o.s+'">취소</button></div>'}).join("");
  }
  return h+'</div>';
}
function viewCard(){
  var h='<div class="two'+(S.csel?' sel':'')+'"><div class="side"><div class="cl">';
  h+=CC.cards.map(function(c){return '<button class="cb'+(S.csel===c.id?' on':'')+'" id="cl-'+esc(c.id)+'" data-cs="'+esc(c.id)+'"><b>'+esc(c.name)+'</b><small>항목 '+c.items.length+' · '+usage(c.id)+'곳</small></button>'}).join("");
  h+='</div><button class="btn pri" data-newc="1" style="width:100%">+ 새 카드</button></div><div class="main">';
  var c=S.csel&&cardBy(S.csel);
  if(!c)return h+'<div class="empty">왼쪽에서 카드를 고르거나 새 카드를 만드세요</div></div></div>';
  h+='<button class="btn mbk" data-cback="1">‹ 목록</button><div class="edit"><div class="card"><div class="row"><input class="q" id="cn" value="'+esc(c.name)+'" style="margin:0;flex:1;font-weight:700"></div>';
  h+='<div style="margin-top:8px">';
  c.items.forEach(function(it,i){
    h+='<div class="it" data-i="'+i+'"><span class="no">'+(i+1)+'</span><input type="text" data-ti="'+i+'" value="'+esc(it.t)+'" placeholder="항목 이름"><span class="ops"><button data-up="'+i+'">↑</button><button data-dn="'+i+'">↓</button><button data-del="'+i+'">×</button></span>';
    h+='<div class="sub"><input type="text" data-si="'+i+'" value="'+esc(it.sub||"")+'" placeholder="작은 설명 (없어도 됨)"><label><input type="checkbox" data-sc2="'+i+'"'+(it.kind==="score"?' checked':'')+'>점수 칸</label></div></div>';
  });
  h+='</div><div class="row" style="margin-top:10px"><button class="btn" data-addit="1">+ 항목 추가</button><button class="btn" data-dup="1">복제</button><button class="btn red'+(S.cf==="dc"?' on':'')+'" data-dc="1">'+(S.cf==="dc"?'한 번 더 누르면 지워요 ('+usage(c.id)+'곳에서 빠짐)':'카드 지우기')+'</button></div></div>';
  h+='<div class="pv"><div style="font-size:12px;font-weight:700;color:#6a7a7d;margin:0 0 8px 2px">학생 화면</div><div class="pbox" id="pv"></div></div></div></div></div>';
  return h;
}
function pvHtml(c){
  if(!c.items.length)return '<div class="empty" style="padding:16px">항목 없음</div>';
  return c.items.map(function(it,i){return '<div class="pi"><span class="pb">'+(i+1)+'</span><span class="pt">'+esc(it.t||" ")+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+'</span></div>'}).join("");
}
function viewCls(){
  var cls=Object.keys(CFG.r);
  var h='<div class="card"><h3>반마다 기본으로 쓰는 카드</h3><div class="mxw"><table class="mx"><tr><th>반</th>'+SLOTS.map(function(s){return '<th>'+s[1]+'</th>'}).join("")+'</tr>';
  cls.forEach(function(c){
    h+='<tr><td><b>'+esc(c)+'</b><br><span class="tag">'+CFG.r[c].length+'명</span></td>'+SLOTS.map(function(s){var cur=(CC.cls[c]&&CC.cls[c][s[0]])||"";return '<td><select data-cc="'+esc(c)+'|'+s[0]+'">'+cardOpts(cur,"없음").replace('<option value="-"'+(cur==="-"?' selected':'')+'>카드 없음</option>',"")+'</select></td>'}).join("")+'</tr>';
  });
  return h+'</table></div></div>';
}

/* ---------- 입력 ---------- */
function ensureSt(n){CC.st[n]=CC.st[n]||{};return CC.st[n]}
function tidySt(n){var o=CC.st[n];if(o&&!Object.keys(o).length)delete CC.st[n]}
function tidyDay(d,n){var o=CC.day[d];if(!o)return;if(o[n]&&!Object.keys(o[n]).length)delete o[n];if(!Object.keys(o).length)delete CC.day[d]}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!loaded)return;var D=b.dataset,c;
  if(D.tab){S.tab=D.tab;S.cf=null;render()}
  else if(D.fc!==undefined){S.cls=D.fc;render()}
  else if(D.sel){S.sel=D.sel;S.cf=null;render();window.scrollTo(0,0)}
  else if(D.back){S.sel=null;render()}
  else if(D.sc){S.scope=D.sc;if(D.sc==="day"&&!S.sdate)S.sdate=iso();render()}
  else if(D.mv){var n1=S.sel;rosterEdit(function(cf){for(var k in cf.r){var i=cf.r[k].indexOf(n1);if(i>-1)cf.r[k].splice(i,1)}cf.r[D.mv].push(n1)})}
  else if(D.rm){if(S.cf==="rm"){var n2=S.sel;S.cf=null;S.sel=null;rosterEdit(function(cf){for(var k in cf.r){var i=cf.r[k].indexOf(n2);if(i>-1)cf.r[k].splice(i,1)}delete cf.s[n2];if(cf.f)cf.f=cf.f.filter(function(x){return x!==n2})}).then(function(){if(CC.st[n2]){delete CC.st[n2];markC()}})}else{S.cf="rm";render()}}
  else if(D.add){var nm=(document.getElementById("addn").value||"").trim(),cc=document.getElementById("addc").value;
    if(!nm)return;if(nm==="열람"||nm.length>8){toast("쓸 수 없는 이름");return}
    if(clsOf(nm)){toast("이미 있는 이름 ("+clsOf(nm)+")");return}
    S.sel=nm;rosterEdit(function(cf){cf.r[cc].push(nm)})}
  else if(D.skip){var n3=S.sel,st=ensureSt(n3),a=(st.skip||[]).slice(),ix=a.indexOf(D.skip);if(ix>-1)a.splice(ix,1);else a.push(D.skip);if(a.length)st.skip=a;else delete st.skip;tidySt(n3);markC();render()}
  else if(D.dx){var p=D.dx.split("|");if(CC.day[p[0]]&&CC.day[p[0]][S.sel]){delete CC.day[p[0]][S.sel][p[1]];tidyDay(p[0],S.sel);markC();render()}}
  else if(D.cs){S.csel=D.cs;S.cf=null;render();window.scrollTo(0,0)}
  else if(D.cback){S.csel=null;render()}
  else if(D.newc){var nc={id:uid(),name:"새 카드",items:[{id:uid(),t:""}]};CC.cards.push(nc);S.csel=nc.id;markC();render();var el=document.getElementById("cn");if(el){el.focus();el.select()}}
  else if(D.addit){c=cardBy(S.csel);c.items.push({id:uid(),t:""});markC();render();var ins=document.querySelectorAll("[data-ti]");if(ins.length)ins[ins.length-1].focus()}
  else if(D.del!==undefined){c=cardBy(S.csel);c.items.splice(+D.del,1);markC();render()}
  else if(D.up!==undefined){c=cardBy(S.csel);var i=+D.up;if(i>0){var t=c.items[i];c.items[i]=c.items[i-1];c.items[i-1]=t;markC();render()}}
  else if(D.dn!==undefined){c=cardBy(S.csel);var j=+D.dn;if(j<c.items.length-1){var t2=c.items[j];c.items[j]=c.items[j+1];c.items[j+1]=t2;markC();render()}}
  else if(D.dup){c=cardBy(S.csel);var d2={id:uid(),name:c.name+" 복사",items:cl(c.items)};CC.cards.push(d2);S.csel=d2.id;markC();render()}
  else if(D.dc){if(S.cf==="dc"){var id=S.csel,k2,s2;CC.cards=CC.cards.filter(function(x){return x.id!==id});
      for(k2 in CC.cls)for(s2 in CC.cls[k2])if(CC.cls[k2][s2]===id)delete CC.cls[k2][s2];
      for(k2 in CC.st){for(s2 in CC.st[k2])if(s2!=="skip"&&CC.st[k2][s2]===id)delete CC.st[k2][s2];tidySt(k2)}
      for(var d3 in CC.day){for(k2 in CC.day[d3]){for(s2 in CC.day[d3][k2])if(CC.day[d3][k2][s2]===id)delete CC.day[d3][k2][s2];tidyDay(d3,k2)}}
      S.csel=null;S.cf=null;markC();render()}else{S.cf="dc";render()}}
});
document.addEventListener("change",function(e){
  var t=e.target;if(!loaded||!t)return;
  if(t.dataset.set){var n=S.sel,slot=t.dataset.set,v=t.value;
    if(S.scope==="day"){var d=S.sdate;CC.day[d]=CC.day[d]||{};CC.day[d][n]=CC.day[d][n]||{};if(v)CC.day[d][n][slot]=v;else delete CC.day[d][n][slot];tidyDay(d,n)}
    else{var st=ensureSt(n);if(v)st[slot]=v;else delete st[slot];tidySt(n)}
    markC();render()}
  else if(t.dataset.cc){var p=t.dataset.cc.split("|");CC.cls[p[0]]=CC.cls[p[0]]||{};if(t.value)CC.cls[p[0]][p[1]]=t.value;else delete CC.cls[p[0]][p[1]];markC()}
  else if(t.id==="sd"){S.sdate=t.value||iso();render()}
  else if(t.dataset.sc2!==undefined){var c=cardBy(S.csel),it=c.items[+t.dataset.sc2];if(t.checked)it.kind="score";else delete it.kind;markC()}
});
document.addEventListener("input",function(e){
  var t=e.target;if(!loaded||!t)return;
  if(t.id==="q"){S.q=t.value.trim();var pos=t.selectionStart;render();var q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos)}
  else if(t.id==="cn"){var c=cardBy(S.csel);c.name=t.value;var el=document.getElementById("cl-"+S.csel);if(el)el.querySelector("b").textContent=t.value;markC()}
  else if(t.dataset.ti!==undefined){var c1=cardBy(S.csel);c1.items[+t.dataset.ti].t=t.value;document.getElementById("pv").innerHTML=pvHtml(c1);markC()}
  else if(t.dataset.si!==undefined){var c2=cardBy(S.csel),it=c2.items[+t.dataset.si];if(t.value)it.sub=t.value;else delete it.sub;document.getElementById("pv").innerHTML=pvHtml(c2);markC()}
});
var _r=render;render=function(){_r();if(S.tab==="card"&&S.csel&&cardBy(S.csel)){var pv=document.getElementById("pv");if(pv)pv.innerHTML=pvHtml(cardBy(S.csel))}};

/* ---------- 시작 ---------- */
function load(){
  Promise.all([getRec(CFGK),getRec(CCK)]).then(function(a){
    CFG=a[0]?normCfg(a[0]):seedCfg();
    CC=(a[1]&&Array.isArray(a[1].cards))?a[1]:seedCards();
    CC.cls=CC.cls||{};CC.st=CC.st||{};CC.day=CC.day||{};
    loaded=true;render();
  }).catch(function(){document.getElementById("app").innerHTML='<div class="empty">불러오지 못했어요. 새로고침해 주세요</div>'});
}
/* 남편 쪽에서 바꾼 내용이 있으면 가져온다 (입력 중이 아닐 때만) */
setInterval(function(){
  if(!loaded||dirtyC||document.visibilityState!=="visible")return;
  var a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"))return;
  Promise.all([getRec(CFGK),getRec(CCK)]).then(function(r){
    var ch=false;
    if(r[0]&&(+r[0].u||0)>(CFG.u||0)){CFG=normCfg(r[0]);ch=true}
    if(r[1]&&Array.isArray(r[1].cards)&&(+r[1].u||0)>(CC.u||0)&&!dirtyC){CC=r[1];CC.cls=CC.cls||{};CC.st=CC.st||{};CC.day=CC.day||{};ch=true}
    if(ch)render();
  }).catch(function(){});
},20000);
load();
</script>
