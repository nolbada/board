<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D1E30">
<title>성적 기록</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f7;color:#1c2b2d;font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 70px}
h1{font-size:21px;margin:0 0 14px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:13px;color:#5b6b6e;margin:18px 0 6px}
a{color:#0b6e73}
button,select,input{font:inherit}
button{border:1px solid #b9c4c6;background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;color:#1c2b2d}
button.pri{background:#0d3b44;border-color:#0d3b44;color:#fff}
button.sm{padding:3px 9px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
input,select{border:1px solid #b9c4c6;border-radius:8px;padding:6px 9px;background:#fff}
nav{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
nav button.on{background:#0d3b44;color:#fff;border-color:#0d3b44}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.card{background:#fff;border:1px solid #dde3e5;border-radius:12px;padding:12px 14px;cursor:pointer}
.card:hover{background:#eef7f7}
.card b{font-size:16px}
.card .m{font-size:12.5px;color:#6a7a7d;margin-top:2px}
.card .k{font-size:13px;margin-top:6px}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 6px;margin-left:4px;background:#fdecc8;color:#7a4a00}
.tag.g{background:#e3efe9;color:#1f5c44}
.box{background:#fff;border:1px solid #dde3e5;border-radius:12px;padding:12px 14px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid #e6ebec;padding:6px 6px;text-align:left;vertical-align:top}
th{color:#5b6b6e;font-weight:600;font-size:12.5px}
tr.rv td{background:#fff8e6}
.muted{color:#7a8a8d;font-size:13px}
svg text{font-family:inherit}
.hide{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rec{background:#fff;border:1px solid #dde3e5;border-left:6px solid var(--c);border-radius:10px;padding:9px 12px;margin-bottom:7px;display:flex;gap:12px;align-items:center}
.rec .dt{width:104px;font-size:12.5px;color:#6a7a7d;flex:none}
.rec .mid{flex:1;min-width:0}
.rec .sc{font-size:19px;font-weight:700;color:var(--c);white-space:nowrap}
.rec .lb{font-size:12.5px;color:#4b5b5e}
.rec .raw{font-size:12px;color:#8a9a9d}
.rec.rv{background:#fffaf0}
.dots{display:flex;gap:4px;margin-top:7px}
.dot{width:9px;height:9px;border-radius:50%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:#5b6b6e;margin:0 0 10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rk{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dde3e5;border-radius:10px;padding:7px 12px;margin-bottom:6px;cursor:pointer}
.rk:hover{background:#eef7f7}
.rk .n{width:30px;text-align:center;font-weight:700;color:#5b6b6e}
.rk .nm{width:150px;flex:none}
.rk .nm small{display:block;color:#7a8a8d;font-size:11.5px}
.rk .bar2{flex:1;height:12px;background:#eef1f2;border-radius:6px;overflow:hidden}
.rk .bar2 b{display:block;height:100%;border-radius:6px}
.rk .v{width:84px;text-align:right;font-weight:700}
.rk .d{width:78px;text-align:right;font-size:12px;color:#8a9a9d}
.rec.nl{flex-wrap:wrap}
.nd{flex-basis:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;padding-top:9px;border-top:1px dashed #eadfc9}
.nd>div{background:#fff8ec;border-radius:8px;padding:6px 9px}
.nd b{display:block;font-size:11.5px;color:#9a6200;font-weight:600}
.nd span{display:block;font-size:12.5px;color:#3a4a4d;margin:1px 0 4px}
.nd i{display:block;height:5px;border-radius:3px;background:#f0e2c8;overflow:hidden}
.nd u{display:block;height:100%;background:#C77A00}
.nd em{display:block;font-style:normal;font-size:12px;font-weight:700;color:#C77A00;margin-top:3px}
.nt{flex-basis:100%;font-size:12px;color:#8a9a9d}
@media(max-width:560px){.nd{grid-template-columns:repeat(2,1fr)}}
.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hd h2{font-size:26px;margin:0}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:12px 0 14px}
.st{background:#fff;border:1px solid #dde3e5;border-top:4px solid var(--c);border-radius:10px;padding:10px 12px}
.st b{display:block;font-size:24px;color:var(--c)}
.st span{display:block;font-size:12.5px;color:#5b6b6e}
.st em{display:block;font-style:normal;font-size:12px;color:#8a9a9d;margin-top:2px}
.yr{font-size:13px;font-weight:700;color:#5b6b6e;margin:16px 0 6px;padding-left:2px}
.ok{color:#1f7a5c}
.err{color:#b3261e}
</style>
</head>
<body>
<div class="wrap">
<div class="row" style="justify-content:space-between"><h1>성적 기록</h1><a href="/board/hq/">관리보드</a></div>

<div id="gate" class="box">
  <div class="row"><button class="pri" id="login">구글 로그인</button><span id="msg" class="muted"></span></div>
</div>

<div id="app" class="hide">
  <nav>
    <button data-tab="stu" class="on">학생</button>
    <button data-tab="col">모아보기</button>
    <button data-tab="inb">입력 대기 <span id="nb"></span></button>
    <button data-tab="cfg">입력 설정</button>
  </nav>

  <section id="t-stu">
    <div id="list">
      <div class="bar">
        <select id="fg"></select>
        <input id="fq" placeholder="이름 검색" style="width:140px">
        <span class="muted" id="cnt"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="detail" class="hide"></div>
  </section>

  <section id="t-col" class="hide">
    <div class="bar">
      <select id="cs"><option value="school">학교 시험</option><option value="nelt">넬트</option><option value="mock">학원 모고</option></select>
      <select id="cm"><option value="rank">줄세우기</option><option value="feed">기록 모아보기</option></select>
      <select id="ce"></select>
      <select id="cg"></select>
      <input id="cq" placeholder="이름 검색" style="width:120px">
      <span class="muted" id="ccnt"></span>
    </div>
    <div id="colout"></div>
  </section>

  <section id="t-inb" class="hide">
    <h2>학생이 제출한 점수</h2>
    <div class="muted" style="margin-bottom:8px">확인을 누르면 학생 기록에 들어가고, 대기 목록에서 사라집니다.</div>
    <div id="inb"></div>
  </section>

  <section id="t-cfg" class="hide">
    <h2>학생 입력 설정</h2>
    <div class="box">
      <div class="row" style="margin-bottom:8px"><span>입력받을 시험</span><select id="cx"></select></div>
      <div class="row" style="margin-bottom:8px"><label><input type="checkbox" id="co"> 지금 입력 받기</label></div>
      <div class="row"><button class="pri" id="csave">저장</button><span id="cmsg" class="muted"></span></div>
    </div>
    <div class="box">
      <div class="muted">학생에게 보낼 링크</div>
      <div style="word-break:break-all;margin-top:4px" id="clink"></div>
    </div>
  </section>
</div>
</div>

<script type="module">
var V='https://www.gstatic.com/firebasejs/10.14.1/';
var A=await import(V+'firebase-app.js');
var Au=await import(V+'firebase-auth.js');
var F=await import(V+'firebase-firestore.js');
var app=A.initializeApp({apiKey:'AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA',authDomain:'nolbada.github.io',projectId:'h-roadmap',appId:'1:575520405083:web:b9f40b64cb0ae3d1a9317e'},'hwfs');
var auth=Au.getAuth(app),db=F.getFirestore(app);
var OK=['nolbada727@gmail.com','ysbada@gmail.com'];
var STU_LINK=location.origin+'/board/score/';
var WD=['일','월','화','수','목','금','토'];
var TYPES=[];
['중 1','중 2','중 3','고 1','고 2','고 3'].forEach(function(g){['1','2'].forEach(function(h){['중간','기말'].forEach(function(k){TYPES.push(g+'-'+h+' '+k)})})});
TYPES.push('전국(모고)','학원(모고)','학원','넬트');
var REV=['불확실','파싱불가','여러값','값이상','날짜확인','점수형식확인','점수없음','대략','같은날중복?'];
var SRC={school:{n:'학교 시험',cats:['school','natl']},nelt:{n:'넬트',cats:['nelt']},mock:{n:'학원 모고',cats:['mock','acad']}};
var CC={school:'#00A1A7',natl:'#2F6FD6',mock:'#7A45D1',acad:'#A57BDB',nelt:'#C77A00',entry:'#8A9A9D'};
var CN={school:'학교 시험',natl:'전국 모의고사',mock:'학원 모고',acad:'학원 시험',nelt:'넬트',entry:'입회 시'};
var S=[],IN=[],cur=null,delArm='',flt='all',shown=60;
var FL={all:['school','natl','mock','acad','nelt','entry'],school:['school','natl'],mock:['mock','acad'],nelt:['nelt','entry']};
function val(r){if(!r.v)return null;if(r.c==='nelt'||r.c==='entry')return r.v.p!=null?r.v.p:(r.v.s!=null?r.v.s:null);return r.v.s!=null?r.v.s:null}
function disp(r){var x=val(r);if(r.c==='nelt'||r.c==='entry'){if(r.v&&r.v.p!=null)return '상위 '+r.v.p+'%'+(r.v.lv!=null?' · Lv'+r.v.lv:'');return x!=null?String(x):''}return x!=null?x+'점':(r.v&&r.v.wc!=null?r.v.wc+'개 틀림':'')}
function legend(){return '<div class="leg">'+['school','natl','mock','acad','nelt'].map(function(k){return '<span><i style="background:'+CC[k]+'"></i>'+CN[k]+'</span>'}).join('')+'</div>'}
function pn(m){if(!m)return null;var o=[],re=/(어휘|문법|듣기|독해)\s+([^/]*?)\s*\(\s*상위\s*(\d+)\s*%\s*\)/g,x;while((x=re.exec(m)))o.push({k:x[1],l:x[2].trim(),p:+x[3]});var tm=m.match(/총\s*([^.]+)$/);return o.length?{o:o,t:tm?tm[1].trim():''}:null}
function ndHtml(nd){return '<div class="nd">'+nd.o.map(function(q){return '<div><b>'+q.k+'</b><span>'+esc(q.l)+'</span><i><u style="width:'+Math.max(4,100-q.p)+'%"></u></i><em>상위 '+q.p+'%</em></div>'}).join('')+'</div>'+(nd.t?'<div class="nt">소요 시간 '+esc(nd.t)+'</div>':'')}
function recCard(r,i,edit){var sc=disp(r),nd=r.c==='nelt'?pn(r.m):null,lv=nd?String(r.r||'').replace(/\(\s*상위[^)]*\)/,'').trim():r.t;return '<div class="rec'+(needRev(r)?' rv':'')+(nd?' nl':'')+'" style="--c:'+(CC[r.c]||'#8A9A9D')+'" data-i="'+i+'"><div class="dt">'+fd(r.d)+'</div><div class="mid"><div class="lb">'+esc(CN[r.c]||r.t)+' · '+esc(nd?lv:r.t)+(r.src==="student"?'<span class="tag g">학생 입력</span>':'')+(needRev(r)?'<span class="tag">확인 필요</span>':'')+'</div>'+(!nd&&r.r&&r.r!==sc?'<div class="raw">'+esc(r.r)+'</div>':'')+(r.m&&!nd?'<div class="raw">'+esc(r.m)+'</div>':'')+'</div><div class="sc">'+esc(sc||r.r)+'</div>'+(edit?'<button class="sm" data-act="edit" data-i="'+i+'">수정</button>':'')+(nd?ndHtml(nd):'')+'</div>'}

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fd(d){var p=String(d).split('-');if(p.length<3)return esc(d);var t=new Date(+p[0],+p[1]-1,+p[2]);return esc(d)+'('+WD[t.getDay()]+')'}
function grp(s){var c=s.cls||'';if(/관리형/.test(c))return '관리형';var m=c.match(/(초등|중1|중2|중3|고1|고2)/);return m?m[1]:'기타'}
function norm(n){return String(n||'').replace(/\s+/g,'')}
function catOf(t){if(/^(중|고) /.test(t))return 'school';if(t==='전국(모고)')return 'natl';if(t==='학원(모고)')return 'mock';if(t==='학원')return 'acad';if(t==='넬트')return 'nelt';if(t==='입회')return 'entry';return 'school'}
function needRev(r){if(r.ok)return false;return (r.f||[]).some(function(x){return REV.indexOf(x)>=0})}
function today(){var d=new Date();function z(n){return (n<10?'0':'')+n}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function save(s){return F.updateDoc(F.doc(db,'sc',s.id),{rec:s.rec,upd:Date.now()})}
function lastOf(s,cat){var a=s.rec.filter(function(r){return r.c===cat&&r.v&&(r.v.s!=null||r.v.p!=null)});return a.length?a[a.length-1]:null}

/* ---- 로그인 ---- */
Au.onAuthStateChanged(auth,async function(u){
  if(u&&OK.indexOf(u.email)>=0){
    $('gate').classList.add('hide');$('app').classList.remove('hide');await loadAll();
  }else{
    $('app').classList.add('hide');$('gate').classList.remove('hide');
    $('msg').textContent=u?'권한이 없는 계정입니다':'';
  }
});
$('login').onclick=function(){
  var p=new Au.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  Au.signInWithPopup(auth,p).catch(function(e){
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))return Au.signInWithRedirect(auth,p);
    $('msg').textContent='로그인 실패: '+(e&&e.code||'');
  });
};

/* ---- 불러오기 ---- */
async function loadAll(){
  var sn=await F.getDocs(F.collection(db,'sc'));
  S=[];sn.forEach(function(d){var x=d.data();x.id=d.id;x.rec=x.rec||[];S.push(x)});
  S.sort(function(a,b){return (a.cls||'').localeCompare(b.cls||'','ko')||a.name.localeCompare(b.name,'ko')});
  var gs=['전체'];S.forEach(function(s){var g=grp(s);if(gs.indexOf(g)<0)gs.push(g)});
  $('fg').innerHTML=gs.map(function(g){return '<option>'+esc(g)+'</option>'}).join('');
  $('cg').innerHTML=$('fg').innerHTML;
  $('cx').innerHTML=TYPES.map(function(t){return '<option>'+esc(t)+'</option>'}).join('');
  renderList();await loadIn();await loadCfg();
  var q0=new URLSearchParams(location.search).get('s');if(q0)openDetail(q0);
}
async function loadIn(){
  var sn=await F.getDocs(F.collection(db,'sc_in'));
  IN=[];sn.forEach(function(d){var x=d.data();x.id=d.id;IN.push(x)});
  IN.sort(function(a,b){return (a.t||0)-(b.t||0)});
  $('nb').innerHTML=IN.length?'<span class="tag">'+IN.length+'</span>':'';
  renderIn();
}
async function loadCfg(){
  var d=await F.getDoc(F.doc(db,'sc_cfg','cur'));var c=d.exists()?d.data():{};
  if(c.x)$('cx').value=c.x;$('co').checked=c.open===true;$('clink').textContent=STU_LINK;
}

/* ---- 학생 목록 ---- */
function renderList(){
  var g=$('fg').value||'전체',q=norm($('fq').value);
  var a=S.filter(function(s){return (g==='전체'||grp(s)===g)&&(!q||norm(s.name).indexOf(q)>=0)});
  $('cnt').textContent=a.length+'명';
  $('grid').innerHTML=a.map(function(s){
    var ne=lastOf(s,'nelt');
    var rs=s.rec.filter(function(r){return (r.c==='school'||r.c==='natl')&&r.v&&r.v.s!=null}).slice(-3).map(function(r){return r.v.s}).join(' → ');
    var seen={};s.rec.forEach(function(r){seen[r.c]=1});
    var dots=['school','natl','mock','acad','nelt'].filter(function(k){return seen[k]}).map(function(k){return '<span class="dot" style="background:'+CC[k]+'"></span>'}).join('');
    return '<div class="card" data-id="'+esc(s.id)+'"><b>'+esc(s.name)+'</b>'+
      '<div class="m">'+esc(s.cls)+' · '+esc(s.school)+'</div>'+(rs?'<div class="k">'+esc(rs)+'</div>':'')+(ne&&ne.v.p!=null?'<div class="k muted">넬트 상위 '+esc(ne.v.p)+'%</div>':'')+'<div class="dots">'+dots+'</div></div>';
  }).join('');
}
$('fg').onchange=renderList;$('fq').oninput=renderList;
$('grid').onclick=function(e){var c=e.target.closest('.card');if(c)openDetail(c.getAttribute('data-id'))};

/* ---- 그래프 ---- */
function chart(title,pts,o){
  if(!pts.length)return '';
  var W=640,H=190,L=34,R=14,T=14,B=34,min=o.min,max=o.max;
  function X(i){return pts.length===1?(L+W-R)/2:L+(W-L-R)*i/(pts.length-1)}
  function Y(v){var f=(v-min)/(max-min);if(o.inv)f=1-f;return T+(H-T-B)*(1-f)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(title)+'">';
  o.grid.forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#e3e8e9"/><text x="'+(L-5)+'" y="'+(Y(v)+4)+'" font-size="11" text-anchor="end" fill="#7a8a8d">'+v+'</text>'});
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i)+' '+Y(p.y)}).join(' ');
  s+='<path d="'+d+'" fill="none" stroke="'+o.color+'" stroke-width="2"/>';
  var step=Math.ceil(pts.length/9);
  pts.forEach(function(p,i){
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="3.5" fill="'+(p.warn?'#fff':o.color)+'" stroke="'+o.color+'" stroke-width="2"/>';
    s+='<text x="'+X(i)+'" y="'+(Y(p.y)-8)+'" font-size="11" text-anchor="middle" fill="#1c2b2d">'+esc(p.y)+'</text>';
    if(i%step===0)s+='<text x="'+X(i)+'" y="'+(H-14)+'" font-size="10.5" text-anchor="middle" fill="#6a7a7d">'+esc(p.x)+'</text>';
  });
  s+='</svg>';
  return '<div class="box"><h3 style="margin-top:0">'+esc(title)+'</h3>'+s+(o.note?'<div class="muted">'+o.note+'</div>':'')+'</div>';
}
function pts(s,cat,key){
  var cs=[].concat(cat);return s.rec.filter(function(r){return cs.indexOf(r.c)>=0&&r.v&&r.v[key]!=null}).map(function(r){return {x:r.d.slice(2,7).replace('-','.'),y:r.v[key],warn:needRev(r)||(r.f||[]).indexOf('날짜임의?')>=0}});
}

/* ---- 학생 상세 ---- */
function openDetail(id){
  cur=S.filter(function(s){return s.id===id})[0];if(!cur)return;
  $('list').classList.add('hide');$('detail').classList.remove('hide');drawDetail();window.scrollTo(0,0);
}
function stat(c,v,l,sub){return '<div class="st" style="--c:'+c+'"><b>'+v+'</b><span>'+l+'</span>'+(sub?'<em>'+sub+'</em>':'')+'</div>'}
function span(from){var a=String(from||'').split('-');if(a.length<2)return '';var n=new Date(),m=(n.getFullYear()-(+a[0]))*12+n.getMonth()+1-(+a[1]);if(m<1)return '';var y=Math.floor(m/12),mo=m%12;return (y?y+'년 ':'')+(mo?mo+'개월':'')}
function nums(s,cats,key){return s.rec.filter(function(r){return cats.indexOf(r.c)>=0&&r.v&&r.v[key]!=null}).map(function(r){return r.v[key]})}
function avg(a){var t=0;a.forEach(function(x){t+=x});return Math.round(t/a.length*10)/10}
function drawDetail(){
  var s=cur,h='',st='';
  var sc=nums(s,['school','natl'],'s'),ne=nums(s,['nelt'],'p'),mk=nums(s,['mock','acad'],'s');
  if(sc.length){var pf=sc.filter(function(x){return x>=100}).length;st+=stat(CC.school,avg(sc),'학교 시험 평균',sc.length+'회'+(pf?' · 100점 '+pf+'회':''))}
  if(ne.length){st+=stat(CC.nelt,'상위 '+ne[ne.length-1]+'%','넬트 최근',ne.length>1?'처음 상위 '+ne[0]+'% · 최고 상위 '+Math.min.apply(null,ne)+'%':'')}
  if(mk.length){st+=stat(CC.mock,avg(mk),'학원 모고 평균',mk.length+'회 · 최근 '+mk[mk.length-1])}
  h+='<div class="bar"><button id="back">목록</button></div><div class="hd"><h2>'+esc(s.name)+'</h2><span class="muted">'+esc(s.cls)+' · '+esc(s.school)+'</span></div><div class="muted">입회 '+fd(s.joined)+(span(s.joined)?' · 함께한 지 '+span(s.joined):'')+'</div>';
  if(st)h+='<div class="sts">'+st+'</div>';
  h+=chart('학교 시험 점수',pts(s,['school','natl'],'s'),{min:0,max:100,grid:[0,50,100],color:'#00A1A7',note:'속이 빈 점은 날짜가 대략이거나 확인이 필요한 값'});
  h+=chart('학원 모의고사 점수',pts(s,['mock','acad'],'s'),{min:0,max:100,grid:[0,50,100],color:'#7A45D1'});
  h+=chart('넬트 상위 % (위로 갈수록 좋음)',pts(s,'nelt','p'),{min:0,max:100,grid:[0,25,50,75,100],color:'#C77A00',inv:true});
  h+='<h3>기록 (최신순)</h3>'+legend()+'<div class="row" style="margin-bottom:8px">'+[['all','전체'],['school','학교'],['mock','학원 모고'],['nelt','넬트']].map(function(q){return '<button class="sm'+(flt===q[0]?' pri':'')+'" data-act="flt" data-v="'+q[0]+'">'+q[1]+'</button>'}).join('')+'</div>';
  var yr='';
  for(var i=s.rec.length-1;i>=0;i--){var r=s.rec[i];if(FL[flt].indexOf(r.c)<0)continue;var y=String(r.d).slice(0,4);if(y!==yr){yr=y;h+='<div class="yr">'+y+'</div>'}h+=recCard(r,i,true)}
  h+='<h3>기록 추가</h3><div class="box"><div class="row"><select id="at">'+TYPES.map(function(t){return '<option>'+esc(t)+'</option>'}).join('')+'</select><input type="date" id="ad" value="'+today()+'"><input id="as" placeholder="점수" style="width:90px"><input id="am" placeholder="메모" style="width:160px"><button class="pri" id="aadd">추가</button><span id="amsg" class="muted"></span></div></div>';
  $('detail').innerHTML=h;
}
$('detail').onclick=function(e){
  var t=e.target;
  if(t.id==='back'){$('detail').classList.add('hide');$('list').classList.remove('hide');renderList();return}
  if(t.id==='aadd'){addRec();return}
  var act=t.getAttribute&&t.getAttribute('data-act');
  if(act==='flt'){flt=t.getAttribute('data-v');drawDetail();return}
  if(act==='edit'){editRow(+t.getAttribute('data-i'))}
  if(act==='save'){saveRow(+t.getAttribute('data-i'))}
  if(act==='cancel'){drawDetail()}
  if(act==='del'){delRow(+t.getAttribute('data-i'))}
};
function editRow(i){
  var r=cur.rec[i],tr=document.querySelector('.rec[data-i="'+i+'"]');
  tr.innerHTML='<div class="row" style="width:100%"><span>'+fd(r.d)+' '+esc(r.t)+'</span><input id="er" value="'+esc(r.r)+'" style="width:200px" placeholder="원본 값"><input id="es" value="'+esc(r.v&&r.v.s!=null?r.v.s:'')+'" style="width:80px" placeholder="점수"><input id="ed" type="date" value="'+esc(r.d)+'"><button class="sm pri" data-act="save" data-i="'+i+'">저장</button><button class="sm" data-act="cancel">취소</button><button class="sm" data-act="del" data-i="'+i+'">삭제</button></div>';
}
async function saveRow(i){
  var r=cur.rec[i],raw=$('er').value.trim(),sv=$('es').value.trim(),d=$('ed').value;
  r.r=raw;r.v=r.v||{};
  if(sv===''){delete r.v.s}else{var n=parseFloat(sv);if(!isNaN(n))r.v.s=n}
  if(d)r.d=d;r.ok=1;
  cur.rec.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  await save(cur);drawDetail();
}
async function delRow(i){
  if(delArm!==cur.id+':'+i){delArm=cur.id+':'+i;var b=document.querySelector('[data-act="del"]');if(b)b.textContent='한 번 더 누르면 삭제';return}
  delArm='';cur.rec.splice(i,1);await save(cur);drawDetail();
}
async function addRec(){
  var t=$('at').value,d=$('ad').value,sv=$('as').value.trim(),m=$('am').value.trim();
  if(!d||!sv){$('amsg').textContent='날짜와 점수를 넣어 주세요';return}
  var r={t:t,c:catOf(t),d:d,r:sv,src:'teacher',ok:1};var n=parseFloat(sv);
  r.v={};if(!isNaN(n)){if(r.c==='nelt')r.v.p=n;else r.v.s=n}
  if(m)r.m=m;
  cur.rec.push(r);cur.rec.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  await save(cur);drawDetail();
}

/* ---- 입력 대기 ---- */
function cand(name){var n=norm(name);return S.filter(function(s){return norm(s.name)===n})}
function renderIn(){
  if(!IN.length){$('inb').innerHTML='<div class="box muted">대기 중인 제출이 없습니다</div>';return}
  $('inb').innerHTML=IN.map(function(x,k){
    var c=cand(x.n),d=new Date(x.t||0);
    var dt=today();if(x.t){var z=function(n){return (n<10?'0':'')+n};dt=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
    var sel='<select data-k="'+k+'" class="who">'+(c.length===1?'':'<option value="">학생 선택</option>')+(c.length?c:S).map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+' · '+esc(s.cls)+'</option>'}).join('')+'</select>';
    return '<div class="box"><div class="row"><b>'+esc(x.n)+'</b><span>'+esc(x.x)+'</span><b>'+esc(x.s)+'</b>'+(x.g?'<span>'+esc(x.g)+'등급</span>':'')+'<span class="muted">'+fd(dt)+'</span></div>'+
      '<div class="row" style="margin-top:8px">'+sel+'<input type="date" data-k="'+k+'" class="dt" value="'+dt+'"><button class="pri sm" data-act="ok" data-k="'+k+'">확인</button><button class="sm" data-act="rm" data-k="'+k+'">삭제</button><span class="muted" id="im'+k+'"></span></div>'+(c.length===0?'<div class="err" style="font-size:13px;margin-top:4px">같은 이름이 없습니다. 직접 골라 주세요.</div>':'')+'</div>';
  }).join('');
}
$('inb').onclick=async function(e){
  var t=e.target,act=t.getAttribute&&t.getAttribute('data-act');if(!act)return;
  var k=+t.getAttribute('data-k'),x=IN[k],m=$('im'+k);
  if(act==='rm'){
    if(t.getAttribute('data-c')!=='1'){t.setAttribute('data-c','1');t.textContent='한 번 더';return}
    await F.deleteDoc(F.doc(db,'sc_in',x.id));await loadIn();return;
  }
  var sid=document.querySelector('select.who[data-k="'+k+'"]').value,d=document.querySelector('input.dt[data-k="'+k+'"]').value;
  if(!sid){m.textContent='학생을 골라 주세요';return}
  var st=S.filter(function(s){return s.id===sid})[0];
  var n=parseFloat(x.s);
  var r={t:x.x,c:catOf(x.x),d:d,r:String(x.s)+(x.g?' ('+x.g+'등급)':''),v:{},src:'student',ok:1};
  if(!isNaN(n))r.v.s=n;
  if(x.g){var gg=parseInt(x.g,10);if(!isNaN(gg))r.v.g=gg}
  var dup=st.rec.some(function(q){return q.t===r.t&&q.c===r.c&&q.src!=='student'});
  if(dup&&t.getAttribute('data-w')!=='1'){t.setAttribute('data-w','1');m.textContent='같은 시험 기록이 이미 있습니다. 한 번 더 누르면 추가합니다';return}
  st.rec.push(r);st.rec.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  await save(st);await F.deleteDoc(F.doc(db,'sc_in',x.id));await loadIn();renderList();
};

/* ---- 설정 ---- */
$('csave').onclick=async function(){
  try{await F.setDoc(F.doc(db,'sc_cfg','cur'),{open:$('co').checked,x:$('cx').value,upd:Date.now()});$('cmsg').className='ok';$('cmsg').textContent='저장됨'}
  catch(e){$('cmsg').className='err';$('cmsg').textContent='실패: '+(e&&e.code||'')}
};

/* ---- 모아보기 ---- */
function keyOf(r,sk){return sk==='school'?r.t:r.d.slice(0,7)}
function fillEx(){
  var sk=$('cs').value,cs=SRC[sk].cats,m={};
  S.forEach(function(s){s.rec.forEach(function(r){if(cs.indexOf(r.c)>=0&&val(r)!=null){var k=keyOf(r,sk);if(!m[k]||m[k]<r.d)m[k]=r.d}})});
  var ks=Object.keys(m).sort(function(a,b){return m[a]<m[b]?1:-1});
  $('ce').innerHTML='<option value="latest">각자 최신</option>'+ks.map(function(k){return '<option value="'+esc(k)+'">'+esc(sk==='school'?k:k+' 시행')+'</option>'}).join('');
}
function renderCol(){
  var sk=$('cs').value,cs=SRC[sk].cats,mode=$('cm').value,g=$('cg').value||'전체',q=norm($('cq').value),ex=$('ce').value;
  $('ce').style.display=mode==='rank'?'':'none';
  var ss=S.filter(function(s){return (g==='전체'||grp(s)===g)&&(!q||norm(s.name).indexOf(q)>=0)});
  var h='',lowBest=(sk==='nelt');
  if(mode==='rank'){
    var rows=[];
    ss.forEach(function(s){
      var a=s.rec.filter(function(r){return cs.indexOf(r.c)>=0&&val(r)!=null&&(ex==='latest'||keyOf(r,sk)===ex)});
      if(a.length)rows.push({s:s,r:a[a.length-1]});
    });
    rows.sort(function(a,b){return lowBest?val(a.r)-val(b.r):val(b.r)-val(a.r)});
    $('ccnt').textContent=rows.length+'명';
    h=(lowBest?'<div class="muted" style="margin-bottom:8px">상위 %가 낮을수록 위에 보입니다</div>':'');
    rows.forEach(function(o,k){
      var v=val(o.r),w=lowBest?Math.max(2,100-v):Math.max(2,Math.min(100,v));
      h+='<div class="rk" data-id="'+esc(o.s.id)+'"><div class="n">'+(k+1)+'</div><div class="nm">'+esc(o.s.name)+'<small>'+esc(o.s.cls)+' · '+esc(o.s.school)+'</small></div><div class="bar2"><b style="width:'+w+'%;background:'+CC[o.r.c]+'"></b></div><div class="v" style="color:'+CC[o.r.c]+'">'+esc(disp(o.r))+'</div><div class="d">'+esc(o.r.d.slice(2))+'</div></div>';
    });
    if(!rows.length)h='<div class="muted">해당하는 기록이 없습니다</div>';
  }else{
    var all=[];
    ss.forEach(function(s){s.rec.forEach(function(r,i){if(cs.indexOf(r.c)>=0)all.push({s:s,r:r,i:i})})});
    all.sort(function(a,b){return a.r.d<b.r.d?1:a.r.d>b.r.d?-1:0});
    $('ccnt').textContent=all.length+'건';
    h=legend();
    all.slice(0,shown).forEach(function(o){
      h+='<div class="rk" data-id="'+esc(o.s.id)+'" style="border-left:6px solid '+CC[o.r.c]+'"><div class="d" style="width:104px;text-align:left">'+fd(o.r.d)+'</div><div class="nm">'+esc(o.s.name)+'<small>'+esc(o.s.cls)+'</small></div><div class="bar2" style="background:none;height:auto;font-size:12.5px;color:#6a7a7d">'+esc(o.r.t)+(o.r.src==='student'?' · 학생 입력':'')+'</div><div class="v" style="color:'+CC[o.r.c]+'">'+esc(disp(o.r)||o.r.r)+'</div></div>';
    });
    if(all.length>shown)h+='<button id="more">더 보기</button>';
  }
  $('colout').innerHTML=h;
}
$('cs').onchange=function(){fillEx();shown=60;renderCol()};
['cm','ce','cg'].forEach(function(k){$(k).onchange=function(){shown=60;renderCol()}});
$('cq').oninput=function(){shown=60;renderCol()};
$('colout').onclick=function(e){
  if(e.target.id==='more'){shown+=60;renderCol();return}
  var c=e.target.closest('.rk');if(c){setTab('stu');openDetail(c.getAttribute('data-id'))}
};

/* ---- 탭 ---- */
function setTab(k){
  document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-tab')===k)});
  ['stu','col','inb','cfg'].forEach(function(t){$('t-'+t).classList.toggle('hide',t!==k)});
  if(k==='inb')loadIn();
  if(k==='col'){fillEx();renderCol()}
}
document.querySelector('nav').onclick=function(e){var b=e.target.closest('button');if(b)setTab(b.getAttribute('data-tab'))};
</script>
</body>
</html>
